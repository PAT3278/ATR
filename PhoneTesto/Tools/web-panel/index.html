<title>PhoneTesto Panel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* A touchable copy of the plugin's panel, built from images the real editor
     rendered (Tests/UiSprites.cpp): knobs drag, keys press, ON AIR and the
     skin key work, and a track can play through a Web Audio approximation of
     the emulation so the meter and the controls can be tried by ear. */
  :root {
    --bg: #17181a; --fg: #e9e7e2; --dim: #9a978f; --line: rgba(255, 255, 255, 0.12); --accent: #ffb547;
    color-scheme: dark;
  }
  html, body { background: var(--bg); color: var(--fg); }
  body { margin: 0; font: 500 14px/1.4 -apple-system, "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none; }
  .wrap { padding-block: 12px 20px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
          max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

  .panel { position: relative; width: 100%; aspect-ratio: 980 / 420; touch-action: none; border-radius: 4px; overflow: hidden;
           box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); background: #000 center / 100% 100% no-repeat; }
  .layer { position: absolute; background-repeat: no-repeat; pointer-events: none; }
  .hit { position: absolute; pointer-events: auto; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .hit:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .live .emulate-only { display: none; }

  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; }
  .bar button, .bar label.pick {
    appearance: none; border: 0; border-radius: 4px; padding: 9px 14px; cursor: pointer;
    font: 700 13px -apple-system, "Segoe UI", sans-serif; letter-spacing: 0.06em; background: var(--fg); color: var(--bg);
  }
  .bar label.pick { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }
  .bar .song { flex: 1 1 200px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); }
  .file { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
  .note { margin: 0; color: var(--dim); font-size: 12.5px; }
  .turn { display: none; margin: 0; padding: 8px 12px; border-radius: 6px; background: rgba(255, 181, 71, 0.12); color: var(--accent); font-size: 13px; }
  @media (orientation: portrait) and (max-width: 700px) { .turn { display: block; } }
</style>

<div class="wrap">
  <p class="turn" id="turn">Turn the phone sideways for a bigger panel.</p>
  <div class="panel" id="panel" aria-label="PhoneTesto panel"></div>
  <div class="bar">
    <button type="button" id="play">PLAY</button>
    <label class="pick" for="file"><span id="pickText">Choose a song</span></label>
    <input id="file" class="file" type="file" accept="audio/*">
    <span class="song" id="song"></span>
  </div>
  <p class="note" id="note">Knobs: drag up or down, double-tap to reset. The sound is an approximation in your browser; the plugin's own processing is more exact.</p>
</div>

<script>
"use strict";
(async function () {
  const ja = /^ja/i.test(navigator.language || "");
  if (ja) {
    document.getElementById("turn").textContent = "スマホを横向きにすると大きく表示されます。";
    document.getElementById("pickText").textContent = "曲を選ぶ";
    document.getElementById("note").textContent = "ノブは上下にドラッグ、ダブルタップでリセット。音はブラウザ上での近似で、プラグイン本体の処理の方が正確です。";
  }

  const geo = await (await fetch("panel.json")).json();
  const W = geo.face[2], H = geo.face[3];
  const panel = document.getElementById("panel");
  const SKINS = ["receiver", "deck", "lab"];
  const state = { skin: 0, live: false, mix: 100, output: 100, model: 3, mono: false, bypass: false };

  // preload every skin's images
  const files = ["emulate", "live", "mix", "output", "keys", "display", "mono", "bypass", "meter"];
  for (const s of SKINS) for (const f of files) { const im = new Image(); im.src = `${s}/${f}.jpg`; }

  const pct = (r) => ({ left: `${r[0] / W * 100}%`, top: `${r[1] / H * 100}%`, width: `${r[2] / W * 100}%`, height: `${r[3] / H * 100}%` });
  function el(cls, rect, extra = "") {
    const d = document.createElement("div");
    d.className = cls + " " + extra;
    Object.assign(d.style, pct(rect));
    panel.appendChild(d);
    return d;
  }

  // layers, from the sprite sheets (frames stacked vertically)
  const L = {
    display: el("layer", geo.display, "emulate-only"),
    mix: el("layer", geo.mix, "emulate-only"),
    output: el("layer", geo.output),
    mono: el("layer", geo.mono, "emulate-only"),
    bypass: el("layer", geo.bypass, "emulate-only"),
    meter: el("layer", geo.meter),
    keys: geo.keys.map(r => el("layer", r, "emulate-only")),
  };
  function sheet(node, file, frames, frame) {
    node.style.backgroundImage = `url(${SKINS[state.skin]}/${file}.jpg)`;
    node.style.backgroundSize = `100% ${frames * 100}%`;
    node.style.backgroundPosition = `0 ${frames > 1 ? frame / (frames - 1) * 100 : 0}%`;
  }
  const knobFrame = v => Math.round(Math.max(0, Math.min(100, v)) / 2.5);
  let meterFrame = 0;

  function render() {
    const s = SKINS[state.skin];
    panel.style.backgroundImage = `url(${s}/${state.live ? "live" : "emulate"}.jpg)`;
    panel.classList.toggle("live", state.live);
    sheet(L.display, "display", 8, state.model);
    sheet(L.mix, "mix", geo.knobFrames, knobFrame(state.mix));
    sheet(L.output, "output", geo.knobFrames, knobFrame(state.output));
    sheet(L.mono, "mono", 2, state.mono ? 1 : 0);
    sheet(L.bypass, "bypass", 2, state.bypass ? 1 : 0);
    sheet(L.meter, "meter", geo.meterFrames, meterFrame);
    L.keys.forEach((k, i) => {
      k.style.backgroundImage = `url(${s}/keys.jpg)`;
      k.style.backgroundSize = "800% 200%";
      k.style.backgroundPosition = `${i / 7 * 100}% ${i === state.model ? 100 : 0}%`;
    });
    const sk = geo.skinKey[`${s}-${state.live ? "live" : "emulate"}`];
    Object.assign(hits.skin.style, pct(sk));
    updateAudio();
  }

  // touch targets
  function hit(rect, label, onTap, extra = "") {
    const d = el("hit", rect, extra);
    d.setAttribute("role", "button"); d.setAttribute("aria-label", label); d.tabIndex = 0;
    d.addEventListener("click", e => { e.preventDefault(); onTap(); });
    d.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onTap(); } });
    return d;
  }
  const hits = {
    skin: hit(geo.skinKey["receiver-emulate"], "Skin", () => { state.skin = (state.skin + 1) % 3; render(); }),
    onAir: hit(geo.onAir, "On air", () => { state.live = !state.live; render(); }),
    mono: hit(geo.mono, "Mono", () => { state.mono = !state.mono; render(); }, "emulate-only"),
    bypass: hit(geo.bypass, "Bypass", () => { state.bypass = !state.bypass; render(); }, "emulate-only"),
  };
  geo.keys.forEach((r, i) => hit(r, geo.profiles[i].name, () => { state.model = i; render(); }, "emulate-only"));

  // knobs: drag up/right to turn up, double-tap to reset, as in the plugin
  function knob(rect, key, extra) {
    const area = [rect[0] + 12, rect[1] + 24, rect[2] - 24, 100];
    const d = el("hit", area, extra);
    d.setAttribute("role", "slider"); d.setAttribute("aria-label", key);
    let start = null, lastTap = 0;
    d.addEventListener("pointerdown", e => {
      d.setPointerCapture(e.pointerId);
      start = { x: e.clientX, y: e.clientY, v: state[key] };
      const now = performance.now();
      if (now - lastTap < 320) { state[key] = 100; render(); start = null; }
      lastTap = now;
    });
    d.addEventListener("pointermove", e => {
      if (!start) return;
      const perPx = 100 / (panel.clientWidth * 0.3); // a full sweep over ~ a third of the panel's width
      state[key] = Math.max(0, Math.min(100, start.v + ((e.clientX - start.x) - (e.clientY - start.y)) * perPx));
      render();
    });
    const end = () => { start = null; };
    d.addEventListener("pointerup", end); d.addEventListener("pointercancel", end);
  }
  knob(geo.mix, "mix", "emulate-only");
  knob(geo.output, "output", "");

  // ---------------------------------------------------------------------
  // Sound: the track through an approximation of the plugin's chain --
  // two 12 dB high-passes, the resonance, a low-pass, soft saturation and
  // the loudness match -- with MIX, OUTPUT, MONO and BYPASS.
  const audio = new Audio(); audio.loop = true; audio.preload = "auto"; audio.src = "song.mp3";
  let ctx = null, nodes = null;
  function build() {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaElementSource(audio);
    const n = {};
    n.stereoTap = ctx.createGain();
    n.monoSum = ctx.createGain(); n.monoSum.channelCount = 1; n.monoSum.channelCountMode = "explicit"; n.monoSum.channelInterpretation = "speakers";
    n.monoTap = ctx.createGain();
    n.hp1 = ctx.createBiquadFilter(); n.hp1.type = "highpass"; n.hp1.Q.value = 0.7071;
    n.hp2 = ctx.createBiquadFilter(); n.hp2.type = "highpass"; n.hp2.Q.value = 0.7071;
    n.peak = ctx.createBiquadFilter(); n.peak.type = "peaking";
    n.lp = ctx.createBiquadFilter(); n.lp.type = "lowpass"; n.lp.Q.value = 0.7071;
    n.shaper = ctx.createWaveShaper(); n.shaper.oversample = "2x";
    n.makeup = ctx.createGain();
    n.wet = ctx.createGain(); n.dry = ctx.createGain(); n.out = ctx.createGain();
    src.connect(n.stereoTap); src.connect(n.monoSum); n.monoSum.connect(n.monoTap);
    for (const t of [n.stereoTap, n.monoTap]) t.connect(n.hp1);
    n.hp1.connect(n.hp2); n.hp2.connect(n.peak); n.peak.connect(n.lp); n.lp.connect(n.shaper); n.shaper.connect(n.makeup); n.makeup.connect(n.wet);
    src.connect(n.dry);
    n.wet.connect(n.out); n.dry.connect(n.out); n.out.connect(ctx.destination);
    const split = ctx.createChannelSplitter(2); n.out.connect(split);
    n.an = [0, 1].map(ch => { const a = ctx.createAnalyser(); a.fftSize = 1024; split.connect(a, ch); return a; });
    nodes = n;
    updateAudio(true);
  }
  let curveFor = null;
  function updateAudio(now) {
    if (!nodes) return;
    const n = nodes, t = ctx.currentTime, k = now ? 0.001 : 0.02;
    const p = geo.profiles[state.model];
    n.hp1.frequency.setTargetAtTime(p.highpassHz, t, k); n.hp2.frequency.setTargetAtTime(p.highpassHz, t, k);
    n.peak.frequency.setTargetAtTime(p.peakHz, t, k); n.peak.Q.setTargetAtTime(p.peakQ, t, k); n.peak.gain.setTargetAtTime(p.peakGainDb, t, k);
    n.lp.frequency.setTargetAtTime(Math.min(p.lowpassHz, ctx.sampleRate * 0.45), t, k);
    if (curveFor !== state.model) {
      const g = Math.pow(10, p.driveDb / 20), c = new Float32Array(2048);
      for (let i = 0; i < c.length; i++) { const x = i / (c.length - 1) * 2 - 1; c[i] = Math.tanh(g * x) / g; }
      n.shaper.curve = c; curveFor = state.model;
    }
    n.makeup.gain.setTargetAtTime(Math.pow(10, p.makeupDb / 20), t, k);
    n.stereoTap.gain.setTargetAtTime(state.mono ? 0 : 1, t, k);
    n.monoTap.gain.setTargetAtTime(state.mono ? 1 : 0, t, k);
    const mix = state.bypass ? 0 : state.mix / 100;
    n.wet.gain.setTargetAtTime(mix, t, k); n.dry.gain.setTargetAtTime(1 - mix, t, k);
    n.out.gain.setTargetAtTime(state.output / 100, t, k);
  }

  const playBtn = document.getElementById("play");
  playBtn.addEventListener("click", async () => {
    if (!ctx) build();
    if (ctx.state !== "running") await ctx.resume();
    if (audio.paused) { await audio.play(); playBtn.textContent = "STOP"; }
    else { audio.pause(); playBtn.textContent = "PLAY"; }
  });

  const song = document.getElementById("song");
  song.textContent = "1st Session NY — vas stvn, p.pulpk, vyst";
  document.getElementById("file").addEventListener("change", e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const wasPlaying = !audio.paused;
    audio.src = URL.createObjectURL(f);
    song.textContent = f.name;
    if (wasPlaying) audio.play();
    e.target.value = "";
  });

  // the meter: the real panel's frames, picked from the output's peak,
  // with the plugin's ballistics (instant attack, 24 dB/s release)
  const buf = new Float32Array(1024);
  let level = -60, last = performance.now();
  function frame(now) {
    const dt = Math.min(0.2, (now - last) / 1000); last = now;
    let peak = 0;
    if (nodes && !audio.paused) for (const a of nodes.an) { a.getFloatTimeDomainData(buf); for (const v of buf) peak = Math.max(peak, Math.abs(v)); }
    const db = peak > 0 ? Math.max(-60, 20 * Math.log10(peak)) : -60;
    level = db > level ? db : Math.max(db, level - 24 * dt);
    const f = Math.max(0, Math.min(geo.meterFrames - 1, Math.round((level + 60) / 2)));
    if (f !== meterFrame) { meterFrame = f; sheet(L.meter, "meter", geo.meterFrames, meterFrame); }
    requestAnimationFrame(frame);
  }
  render();
  requestAnimationFrame(frame);
})();
</script>
