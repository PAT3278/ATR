<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhoneTesto</title>
<script src="three.min.js"></script>
<style>
  /* PhoneTesto's editor: the speakers sit on a lamp-lit desk; a thin control strip runs under it.
     The picture is the control surface -- moving the camera between speakers changes the model,
     pulling focus to the studio monitors behind sets the mix. */
  @font-face { font-family: "Barlow"; src: url("fonts/Barlow-Medium.ttf") format("truetype"); font-weight: 400 500; }
  @font-face { font-family: "Barlow"; src: url("fonts/Barlow-SemiBold.ttf") format("truetype"); font-weight: 600; }
  @font-face { font-family: "Barlow"; src: url("fonts/Barlow-Bold.ttf") format("truetype"); font-weight: 700; }
  @font-face { font-family: "Barlow Condensed"; src: url("fonts/BarlowCondensed-SemiBold.ttf") format("truetype"); font-weight: 500 600; }
  @font-face { font-family: "Barlow Condensed"; src: url("fonts/BarlowCondensed-Bold.ttf") format("truetype"); font-weight: 700; }
  :root {
    --room: #0d0c0b;
    --strip: #151311;
    --ink: #eee7dc;
    --dim: #8f877b;
    --lamp: #ffb45e;
    --air: #ff5a3c;
    --line: rgba(238, 231, 220, 0.12);
    --chip: rgba(238, 231, 220, 0.06);
    --sans: "Barlow", "Helvetica Neue", Arial, sans-serif;
    --cond: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--room); color: var(--ink); font-family: var(--sans); overflow: hidden; user-select: none; -webkit-user-select: none; cursor: default; }
  .app { height: 100%; display: grid; grid-template-rows: minmax(0, 1fr) auto; }
  .stage { position: relative; overflow: hidden; touch-action: none; cursor: grab; }
  .stage:active { cursor: grabbing; }
  .stage:focus-visible { outline: 2px solid var(--lamp); outline-offset: -3px; }
  .stage > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 75% 70% at 50% 46%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%); }
  .hud { position: absolute; left: 18px; right: 18px; top: 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; pointer-events: none; }
  .brand { font: 700 12px var(--cond); letter-spacing: 0.24em; color: var(--dim); margin-bottom: 6px; }
  .name { font: 600 clamp(22px, 3.4vw, 34px)/1 var(--cond); letter-spacing: 0.02em; }
  .spec { font: 500 12px/1.4 var(--sans); color: var(--dim); letter-spacing: 0.06em; text-transform: uppercase; font-variant-numeric: tabular-nums; text-align: right; }
  .hint { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font: 500 12px var(--sans);
          color: var(--dim); letter-spacing: 0.04em; pointer-events: none; transition: opacity 0.6s; }
  .hint.gone { opacity: 0; }
  body.live .hud .name, body.live .hud .spec { display: none; }

  /* Live, the first screen: the code to scan, large and crisp, over the room out of focus */
  .listen { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px 18px;
            background: radial-gradient(ellipse at 50% 48%, rgba(13, 12, 11, 0.25), rgba(13, 12, 11, 0.7)); }
  .listen-card { --qr: clamp(140px, min(46vh, 32vw), 300px); display: flex; align-items: center; gap: 28px; max-width: 760px;
                 padding: 24px; border-radius: 10px; background: rgba(21, 19, 17, 0.88); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55); }
  .listen canvas { width: var(--qr); height: var(--qr); flex: none; background: #fff; border-radius: 6px; image-rendering: pixelated; }
  .listen-text { display: grid; gap: 10px; min-width: 0; max-width: 340px; }
  .listen-text > * { min-width: 0; }
  .onair { display: flex; align-items: center; gap: 8px; font: 700 12px var(--cond); letter-spacing: 0.2em; color: var(--air); }
  .onair::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--air); box-shadow: 0 0 10px var(--air); }
  .listen h1 { margin: 0; font: 600 clamp(22px, 3vw, 30px)/1.1 var(--cond); letter-spacing: 0.01em; text-wrap: balance; }
  .listen p { margin: 0; font: 500 14px/1.45 var(--sans); color: var(--dim); }
  .listen .count { font: 600 15px var(--sans); }
  .listen .send { height: 4px; border-radius: 2px; background: rgba(238, 231, 220, 0.08); overflow: hidden; }
  .listen .send i { display: block; height: 100%; width: 0; background: var(--lamp); }
  .listen .url { font: 500 12px/1.35 var(--sans); color: var(--dim); word-break: break-all; user-select: text; -webkit-user-select: text; }
  .listen label { display: grid; gap: 5px; font: 600 11px var(--cond); letter-spacing: 0.12em; color: var(--dim); text-transform: uppercase; }
  .listen input { width: 100%; min-width: 0; font: 600 14px var(--sans); color: var(--ink); background: rgba(238,231,220,0.06); border: 1px solid var(--line);
                  border-radius: 4px; padding: 7px 9px; user-select: text; -webkit-user-select: text; }
  .listen input::placeholder { color: var(--dim); opacity: 0.55; font-weight: 500; }
  .listen .err { font: 500 13px/1.4 var(--sans); color: var(--air); }
  .listen .note { font: 500 12px/1.4 var(--sans); color: var(--dim); opacity: 0.8; }
  .retry { justify-self: start; appearance: none; border: 1px solid var(--air); border-radius: 999px; padding: 8px 14px; background: transparent;
           color: var(--air); font: 600 12px var(--cond); letter-spacing: 0.12em; cursor: pointer; }
  @media (max-width: 640px) { .listen-card { flex-direction: column; text-align: center; gap: 16px; padding: 18px; } .listen-text { justify-items: center; } .listen label { width: 100%; } }
  @media (max-height: 560px) { .listen-card { padding: 16px; gap: 20px; } .listen p { font-size: 13px; } .listen .note { display: none; } }
  @media (max-height: 470px) { .listen .url { display: none; } }

  .strip { background: var(--strip); border-top: 1px solid var(--line); display: grid; gap: 12px; padding: 12px 18px 14px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; appearance: none; border: 0; border-radius: 999px; padding: 8px 13px; background: var(--chip); color: var(--dim);
          font: 600 13px var(--cond); letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; transition: background 0.3s, color 0.3s; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--room); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
  .air { appearance: none; border: 1px solid var(--air); height: 40px; border-radius: 999px; padding: 0 18px 0 14px; background: transparent; color: var(--ink);
         font: 700 13px var(--cond); letter-spacing: 0.16em; cursor: pointer; display: flex; align-items: center; gap: 9px; flex: none; }
  .air::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--air); box-shadow: 0 0 8px var(--air); }
  .emu { appearance: none; border: 1px solid var(--line); height: 40px; border-radius: 999px; padding: 0 16px; background: transparent; color: var(--dim);
         font: 600 12px var(--cond); letter-spacing: 0.12em; cursor: pointer; flex: none; }
  .emu b { color: var(--ink); font-weight: 600; margin-left: 6px; }
  /* one mode at a time: on the air the emulation's controls aren't shown */
  body.live .emu-only { display: none !important; }
  body:not(.live) .live-only { display: none !important; }
  .ctl { display: grid; gap: 4px; flex: 1 1 150px; min-width: 0; }
  .ctl span { display: flex; justify-content: space-between; font: 600 11px var(--cond); letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
  .ctl output { color: var(--ink); font-variant-numeric: tabular-nums; }
  input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; margin: 0; cursor: pointer; }
  input[type="range"]::-webkit-slider-runnable-track { height: 2px; background: var(--line); }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--ink); margin-top: -8px; }
  .tog { appearance: none; border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; background: transparent; color: var(--dim);
         font: 600 12px var(--cond); letter-spacing: 0.12em; cursor: pointer; flex: none; }
  .tog[aria-pressed="true"] { border-color: var(--lamp); color: var(--lamp); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }

  /* outside the plugin: play a song through the page's sketch of the emulation */
  .demo { display: flex; align-items: center; gap: 12px; flex: 1 1 210px; min-width: 0; }
  .play { appearance: none; border: 0; width: 40px; height: 40px; border-radius: 50%; background: var(--lamp); color: #1b1208; cursor: pointer;
          display: grid; place-items: center; flex: none; }
  .play svg { width: 15px; height: 15px; fill: currentColor; }
  .song { display: grid; gap: 2px; min-width: 0; }
  .song b { font: 600 13px var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song label { font: 500 12px var(--sans); color: var(--dim); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; width: max-content; }
  .song input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .song input:focus-visible + label { outline: 2px solid var(--lamp); outline-offset: 2px; }
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage" tabindex="0" role="group" aria-label="Speaker room. Drag sideways or press the left and right arrows to change speakers; drag up or down or press the up and down arrows to pull focus between the speaker and the studio monitors.">
    <canvas id="back"></canvas>
    <canvas id="dev"></canvas>
    <canvas id="fx"></canvas>
    <div class="vignette"></div>
    <div class="hud"><div><div class="brand">PHONETESTO</div><div class="name" id="name" aria-live="polite">Phone 15/16 Pro</div></div><div class="spec" id="spec"></div></div>
    <div class="hint emu-only" id="hint">Drag sideways to change speakers &#xb7; Drag up or down to pull focus</div>
    <div class="listen" id="listen" role="region" aria-labelledby="listenTitle" hidden>
      <div class="listen-card">
        <canvas id="qr" width="600" height="600" role="img" aria-label="QR code: open it with your phone's camera to listen"></canvas>
        <div class="listen-text">
          <div class="onair" id="onair">ON AIR</div>
          <h1 id="listenTitle">Listen on your phone</h1>
          <p id="listenHow">Scan the code with your phone's camera. The phone needs the same Wi-Fi as this computer.</p>
          <div class="count" id="liveCount" aria-live="polite"></div>
          <div class="send" aria-hidden="true"><i id="sendLevel"></i></div>
          <div class="url" id="liveUrl"></div>
          <label for="pw"><span id="pwLabel">Password (optional)</span><input id="pw" type="text" maxlength="32" autocomplete="off" spellcheck="false"></label>
          <div class="err" id="liveErr" hidden></div>
          <button class="retry" id="retry" type="button" hidden>Try again</button>
          <div class="note" id="liveNote">Phones get the mix as it is: no speaker emulation while on air.</div>
        </div>
      </div>
    </div>
  </div>
  <div class="strip">
    <div class="chips emu-only" id="chips" role="group" aria-label="Speaker model"></div>
    <div class="row">
      <div class="demo emu-only" id="demo" hidden>
        <button class="play" id="play" type="button" aria-label="Play" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path id="playIcon" d="M3 1.5v13l11-6.5z"/></svg></button>
        <div class="song"><b id="songName">song.mp3</b><input id="file" type="file" accept="audio/*"><label for="file" id="pick">Choose a song</label></div>
      </div>
      <button class="air emu-only" id="toLive" type="button">LISTEN ON PHONE</button>
      <label class="ctl emu-only" for="mix"><span>Focus <output id="mixOut">Phone 100%</output></span><input id="mix" type="range" min="0" max="100" step="0.5" value="100"></label>
      <label class="ctl" for="vol"><span>Output <output id="volOut">100%</output></span><input id="vol" type="range" min="0" max="100" step="0.5" value="100"></label>
      <button class="tog emu-only" id="mono" type="button" aria-pressed="false">MONO</button>
      <button class="tog emu-only" id="bypass" type="button" aria-pressed="false">BYPASS</button>
      <button class="emu live-only" id="toEmulate" type="button">SPEAKER EMULATION<b id="emuState">OFF</b></button>
    </div>
  </div>
</div>

<script>
(() => {
  const ja = /^ja/i.test(navigator.language || "");
  if (ja) document.documentElement.lang = "ja";
  if (ja) {
    const t = (id, text) => { document.getElementById(id).textContent = text; };
    t("listenTitle", "\u30b9\u30de\u30db\u3067\u8074\u304f");
    t("listenHow", "\u30b9\u30de\u30db\u306e\u30ab\u30e1\u30e9\u3067\u8aad\u307f\u53d6\u3063\u3066\u304f\u3060\u3055\u3044\u3002\u3053\u306ePC\u3068\u540c\u3058Wi-Fi\u306b\u3064\u306a\u3044\u3067\u304a\u304d\u307e\u3059\u3002");
    t("pwLabel", "\u30d1\u30b9\u30ef\u30fc\u30c9\uff08\u4efb\u610f\uff09");
    t("retry", "\u3082\u3046\u4e00\u5ea6");
    t("liveNote", "\u30b9\u30de\u30db\u306b\u306f\u30df\u30c3\u30af\u30b9\u304c\u305d\u306e\u307e\u307e\u5c4a\u304d\u307e\u3059\u3002\u30aa\u30f3\u30a8\u30a2\u4e2d\u306f\u30a8\u30df\u30e5\u30ec\u30fc\u30c8\u3057\u307e\u305b\u3093\u3002");
    t("toLive", "\u30b9\u30de\u30db\u3067\u8074\u304f");
    document.getElementById("toEmulate").firstChild.textContent = "\u30b9\u30d4\u30fc\u30ab\u30fc\u3092\u30a8\u30df\u30e5\u30ec\u30fc\u30c8";
  }
  if (ja) document.getElementById("hint").textContent = "\u6a2a\u306b\u30c9\u30e9\u30c3\u30b0\u3067\u6a5f\u7a2e\u3092\u5207\u308a\u66ff\u3048\u30fb\u4e0a\u4e0b\u306b\u30c9\u30e9\u30c3\u30b0\u3067\u30d4\u30f3\u30c8";

  // ---- the plugin: parameters and meters come in as "state", controls go out as "ui" ----
  const backend = window.__JUCE__ && window.__JUCE__.backend;
  const listeners = [];
  const demo = backend ? null : (() => {
    // Opened outside the plugin (in a browser), the page runs against this stand-in: it
    // plays a song through a Web Audio sketch of the emulation (a song.mp3 beside the
    // page, or one the viewer chooses), so the room can be tried by ear.
    const st = { mode: "emulate", device: 3, mix: 100, output: 100, mono: false, bypass: false, peak: [0, 0], dry: 0, bands: [],
                 live: { on: false, failed: false, example: false, url: "", listeners: 0, password: "", code: "", qr: "", qrSize: 0 } };
    const keys = { device: "device", mix: "mix", output: "output", monoSum: "mono", bypass: "bypass" };
    const audio = new Audio(); audio.loop = true; audio.preload = "auto"; audio.src = "song.mp3";
    const bands = new Array(30).fill(0);
    let ctx = null, A = null, morphPos = null;

    function shaperCurve(db) { const g = Math.pow(10, db / 20), c = new Float32Array(2048);
      for (let i = 0; i < c.length; i++) { const x = i / 2047 * 2 - 1; c[i] = Math.tanh(g * x) / g; } return c; }
    function build() {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      const src = ctx.createMediaElementSource(audio), n = { chains: [] };
      n.stereo = ctx.createGain(); n.monoSum = ctx.createGain();
      n.monoSum.channelCount = 1; n.monoSum.channelCountMode = "explicit"; n.monoSum.channelInterpretation = "speakers";
      n.monoTap = ctx.createGain(); n.pre = ctx.createGain();
      src.connect(n.stereo); src.connect(n.monoSum); n.monoSum.connect(n.monoTap); n.stereo.connect(n.pre); n.monoTap.connect(n.pre);
      n.wet = ctx.createGain(); n.dry = ctx.createGain(); n.out = ctx.createGain(); n.engaged = ctx.createGain(); n.bypassed = ctx.createGain();
      for (let k = 0; k < 2; k++) {
        const c = { model: -1 };
        c.hp1 = ctx.createBiquadFilter(); c.hp1.type = "highpass"; c.hp1.Q.value = 0.7071;
        c.hp2 = ctx.createBiquadFilter(); c.hp2.type = "highpass"; c.hp2.Q.value = 0.7071;
        c.pk = ctx.createBiquadFilter(); c.pk.type = "peaking";
        c.lp = ctx.createBiquadFilter(); c.lp.type = "lowpass"; c.lp.Q.value = 0.7071;
        c.sh = ctx.createWaveShaper(); c.sh.oversample = "2x"; c.mk = ctx.createGain(); c.gain = ctx.createGain(); c.gain.gain.value = 0;
        n.pre.connect(c.hp1); c.hp1.connect(c.hp2); c.hp2.connect(c.pk); c.pk.connect(c.lp); c.lp.connect(c.sh); c.sh.connect(c.mk); c.mk.connect(c.gain); c.gain.connect(n.wet);
        n.chains.push(c);
      }
      // as in the plugin: emulation, mixed with the dry signal, output level; BYPASS passes the dry signal untouched
      n.wet.connect(n.out); src.connect(n.dry); n.dry.connect(n.out); n.out.connect(n.engaged); n.engaged.connect(ctx.destination);
      src.connect(n.bypassed); n.bypassed.connect(ctx.destination); n.bypassed.gain.value = 0;
      n.anOut = ctx.createAnalyser(); n.anOut.fftSize = 2048; n.anOut.smoothingTimeConstant = 0; n.engaged.connect(n.anOut); n.bypassed.connect(n.anOut);
      n.anIn = ctx.createAnalyser(); n.anIn.fftSize = 2048; src.connect(n.anIn);
      n.td = new Float32Array(2048); n.fd = new Float32Array(1024);
      A = n;
    }
    function program(c, i) {
      if (c.model === i) return;
      const p = P[i], t = ctx.currentTime;
      c.hp1.frequency.setValueAtTime(p.hp, t); c.hp2.frequency.setValueAtTime(p.hp, t);
      c.pk.frequency.setValueAtTime(p.pk, t); c.pk.Q.setValueAtTime(p.q, t); c.pk.gain.setValueAtTime(p.g, t);
      c.lp.frequency.setValueAtTime(Math.min(p.lp, ctx.sampleRate * 0.45), t);
      c.sh.curve = shaperCurve(p.drive); c.mk.gain.setValueAtTime(Math.pow(10, p.mk / 20), t);
      c.model = i;
    }
    const peakOf = an => { an.getFloatTimeDomainData(A.td); let m = 0; for (let i = 0; i < an.fftSize; i++) m = Math.max(m, Math.abs(A.td[i])); return m; };
    function frame() {
      const playing = !!A && !audio.paused;
      if (A) {
        // the speakers either side of the position, blended linearly, as the plugin does
        const t = ctx.currentTime, k = 0.012, top = P.length - 1;
        const pos = Math.max(0, Math.min(top, morphPos !== null ? morphPos : st.device));
        const lo = Math.min(top - 1, Math.floor(pos)), f = pos - lo;
        program(A.chains[lo % 2], lo); program(A.chains[(lo + 1) % 2], lo + 1);
        A.chains[lo % 2].gain.gain.setTargetAtTime(1 - f, t, k); A.chains[(lo + 1) % 2].gain.gain.setTargetAtTime(f, t, k);
        const mono = st.mono ? 1 : 0, mix = st.mix / 100, on = st.bypass ? 0 : 1;
        A.stereo.gain.setTargetAtTime(1 - mono, t, k); A.monoTap.gain.setTargetAtTime(mono, t, k);
        A.wet.gain.setTargetAtTime(mix, t, k); A.dry.gain.setTargetAtTime(1 - mix, t, k);
        A.out.gain.setTargetAtTime(st.output / 100, t, k);
        A.engaged.gain.setTargetAtTime(on, t, k); A.bypassed.gain.setTargetAtTime(1 - on, t, k);
      }
      const out = playing ? peakOf(A.anOut) : 0;
      st.peak = [out, out]; st.dry = playing ? peakOf(A.anIn) : 0;
      if (playing) {
        A.anOut.getFloatFrequencyData(A.fd);
        const lo = Math.log(60), hi = Math.log(18000), binHz = ctx.sampleRate / A.anOut.fftSize;
        for (let b = 0; b < 30; b++) {
          const f0 = Math.exp(lo + (hi - lo) * b / 30), f1 = Math.exp(lo + (hi - lo) * (b + 1) / 30);
          let m = -200;
          for (let i = Math.max(1, Math.floor(f0 / binHz)); i <= Math.min(A.fd.length - 1, Math.ceil(f1 / binHz)); i++) m = Math.max(m, A.fd[i]);
          bands[b] = Math.max(Math.max(0, Math.min(1, (m + 85) / 66)), bands[b] * 0.86); // the plugin's scale, quick rise, gentle fall
        }
      } else bands.fill(0);
      st.bands = bands.slice();
      listeners.forEach(fn => fn(JSON.parse(JSON.stringify(st))));
    }
    setInterval(frame, 1000 / 30);

    // ON AIR needs the plugin on a network: here the card shows what it looks like, marked as an example
    function example() {
      const n = 25, bits = [];
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
        const finder = (x < 7 && y < 7) || (x >= n - 7 && y < 7) || (x < 7 && y >= n - 7);
        const fx = x >= n - 7 ? x - (n - 7) : x, fy = y >= n - 7 ? y - (n - 7) : y;
        bits.push(finder ? ((fx === 0 || fx === 6 || fy === 0 || fy === 6 || (fx > 1 && fx < 5 && fy > 1 && fy < 5)) ? "1" : "0")
                         : (((x * 7 + y * 13 + x * y) % 5) < 2 ? "1" : "0"));
      }
      return { on: true, example: true, url: "", qr: bits.join(""), qrSize: n };
    }
    return {
      audio,
      handle(o) {
        if (o.type === "param") { const key = keys[o.id]; if (key) st[key] = (key === "mono" || key === "bypass") ? !!o.value : o.value; }
        if (o.type === "morph") morphPos = o.end ? null : o.pos;
        if (o.type === "mode") { st.mode = o.live ? "live" : "emulate"; Object.assign(st.live, o.live ? example() : { on: false, example: false, qr: "", qrSize: 0 }); }
        if (o.type === "password") st.live.password = o.value;
      },
      async toggle() {
        if (!ctx) build();
        if (ctx.state === "suspended") await ctx.resume();

  const toLiveB = document.getElementById("toLive"), toEmulateB = document.getElementById("toEmulate"), retryB = document.getElementById("retry");
  const listenEl = document.getElementById("listen"), sendLevel = document.getElementById("sendLevel");
  let hinted = false; function hint() { if (!hinted) { hinted = true; document.getElementById("hint").classList.add("gone"); } }

  // A move the user makes (drag, model key, arrow) carries the sound with the camera:
  // the plugin blends the speakers either side of the position until it settles.
  function pick(i) { S.pTarget = i; S.userMove = true; sendDevice(i); }
  function sendDevice(i) { if (i === S.sentDevice) return; S.sentDevice = i; gesture("device", true); setParam("device", i); gesture("device", false); }

  // sliders: a gesture for the whole drag, so a host records one automation move
  function bindSlider(el, id, busyKey, onValue) {
    el.addEventListener("pointerdown", () => { S[busyKey] = true; gesture(id, true); });
    const end = () => { if (S[busyKey]) { S[busyKey] = false; gesture(id, false); } };
    el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end); el.addEventListener("change", end);
    el.addEventListener("input", () => { onValue(+el.value); setParam(id, +el.value); hint(); });
  }
  bindSlider(mixIn, "mix", "mixBusy", v => { S.mixUser = v / 100; });
  function nudgeMix(delta) {
    S.mixUser = Math.max(0, Math.min(1, S.mixUser + delta / 100)); mixIn.value = (S.mixUser * 100).toFixed(1);
    gesture("mix", true); setParam("mix", S.mixUser * 100); gesture("mix", false);
  }
  bindSlider(volIn, "output", "outBusy", v => { S.outT = v / 100; });
  S.outT = 1;
  const toggle = (id, on) => { gesture(id, true); setParam(id, on ? 1 : 0); gesture(id, false); };
  monoB.addEventListener("click", () => { S.monoT = S.monoT ? 0 : 1; monoB.setAttribute("aria-pressed", S.monoT ? "true" : "false"); toggle("monoSum", !!S.monoT); });
  bypB.addEventListener("click", () => { S.bypass = !S.bypass; bypB.setAttribute("aria-pressed", S.bypass ? "true" : "false"); toggle("bypass", S.bypass); });
  // one mode at a time: phones (Live) or the speaker emulation
  toLiveB.addEventListener("click", () => send({ type: "mode", live: true }));
  toEmulateB.addEventListener("click", () => send({ type: "mode", live: false }));
  retryB.addEventListener("click", () => send({ type: "mode", live: true }));
  const pw = document.getElementById("pw");
  pw.addEventListener("input", () => send({ type: "password", value: pw.value.trim() }));

  // drag sideways: slide along the desk (the model changes as the next speaker takes the light);
  // drag up or down: pull focus between the speaker and the studio monitors (the mix)
  let drag = null;
  stage.addEventListener("pointerdown", e => {
    if (S.mode === "live" || (e.target.closest && e.target.closest(".listen"))) return;
    stage.setPointerCapture(e.pointerId); drag = { x: e.clientX, y: e.clientY, p: S.p, m: S.mixUser, axis: null }; S.dragging = true; hint();
  });
  stage.addEventListener("pointermove", e => {
    if (!drag) return;
    const ddx = e.clientX - drag.x, ddy = e.clientY - drag.y;
    if (!drag.axis && Math.hypot(ddx, ddy) > 6) {
      drag.axis = Math.abs(ddx) > Math.abs(ddy) ? "x" : "y";
      if (drag.axis === "x") S.userMove = true;
      if (drag.axis === "y") { S.mixBusy = true; gesture("mix", true); }
    }
    if (drag.axis === "x") {
      S.p = Math.max(-0.25, Math.min(P.length - 0.75, drag.p - ddx / (W * 0.45))); S.pTarget = S.p;
      sendDevice(Math.max(0, Math.min(P.length - 1, Math.round(S.p))));
    }
    if (drag.axis === "y") { S.mixUser = Math.max(0, Math.min(1, drag.m - ddy / (H * 0.6))); mixIn.value = (S.mixUser * 100).toFixed(1); setParam("mix", S.mixUser * 100); }
  });
  const endDrag = () => {
    if (!drag) return;
    if (drag.axis === "x") { const i = Math.max(0, Math.min(P.length - 1, Math.round(S.p - S.pVel * 6))); S.pTarget = i; sendDevice(i); }
    if (drag.axis === "y") { S.mixBusy = false; gesture("mix", false); }
    drag = null; S.dragging = false;
  };
  stage.addEventListener("pointerup", endDrag); stage.addEventListener("pointercancel", endDrag);
  // Keys. The room uses the arrows; the rest belong to the host (the space bar: play/stop).
  // After mouse use the plugin takes keyboard focus back from the page, so keys go to it
  // and on to the host as with any plugin. While the page has focus (tabbed into), keys it
  // doesn't use are passed on: on Windows by the plugin; WebKit passes them up itself.
  const isTyping = el => !!el && el.tagName === "INPUT" && el.type === "text";
  const passKeysOn = !!backend && /Win/i.test(navigator.platform || navigator.userAgent || "");
  const passedOn = new Set();
  const ownsKey = e => {
    const t = e.target;
    if (isTyping(t) || e.key === "Tab") return true;
    const control = t && (t.tagName === "BUTTON" || (t.tagName === "INPUT" && t.type === "range"));
    if (control && (e.key === " " || e.key === "Enter")) return true;              // pressing the focused control
    if (t && t.tagName === "INPUT" && t.type === "range" && e.key.startsWith("Arrow")) return true; // a slider's own keys
    return false;
  };
  window.addEventListener("keydown", e => {
    if (ownsKey(e) || e.ctrlKey || e.metaKey || e.altKey) {
      if (!ownsKey(e) && passKeysOn) { passedOn.add(e.keyCode); send({ type: "key", keyCode: e.keyCode, down: true }); e.preventDefault(); }
      return;
    }
    if (S.mode !== "live" && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
      pick(Math.max(0, Math.min(P.length - 1, Math.round(S.pTarget) + (e.key === "ArrowRight" ? 1 : -1)))); hint(); e.preventDefault(); return;
    }
    if (S.mode !== "live" && (e.key === "ArrowUp" || e.key === "ArrowDown")) { nudgeMix(e.key === "ArrowUp" ? 5 : -5); hint(); e.preventDefault(); return; }
    if (passKeysOn) { passedOn.add(e.keyCode); send({ type: "key", keyCode: e.keyCode, down: true }); e.preventDefault(); }
  });
  window.addEventListener("keyup", e => {
    if (passedOn.has(e.keyCode)) { passedOn.delete(e.keyCode); send({ type: "key", keyCode: e.keyCode, down: false }); e.preventDefault(); }
  });
  document.addEventListener("pointerup", () => {
    if (!backend || isTyping(document.activeElement)) return;
    const a = document.activeElement;
    if (a && a !== document.body && a.blur) a.blur();
    send({ type: "releaseFocus" });
  }, true);

  // the plugin's state: follow the host (automation, presets) whenever the user isn't touching that control
  const qrC = document.getElementById("qr"), qx = qrC.getContext("2d");
  let qrShown = "";
  function markExample(g, x0, y0, size) {
    // the stand-in's code isn't a real one: say so across it
    g.save(); g.fillStyle = "rgba(13,12,11,0.82)"; g.fillRect(x0, y0 + size * 0.4, size, size * 0.2);
    g.fillStyle = "#ffb45e"; g.font = `700 ${Math.round(size * 0.11)}px "Barlow Condensed", sans-serif`; g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(ja ? "\u4f8b" : "EXAMPLE", x0 + size / 2, y0 + size / 2); g.restore();
  }
  function drawQr(g, size, qr, n, x0, y0) {
    const quiet = 2, cell = size / (n + quiet * 2);
    g.fillStyle = "#fff"; g.fillRect(x0, y0, size, size); g.fillStyle = "#000";
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (qr[y * n + x] === "1")
      g.fillRect(Math.floor(x0 + (x + quiet) * cell), Math.floor(y0 + (y + quiet) * cell), Math.ceil(cell), Math.ceil(cell));
  }
  onState(st => {
    if (!st) return;
    haveState = true;
    if (st.selfTest && !S.selfTest) { S.selfTest = true; wake(); }
    const mode = st.mode || (st.live.on ? "live" : "emulate");
    if (mode !== S.mode || st.live.on !== S.live.on || st.live.listeners !== S.live.listeners || st.device !== S.device || st.mono !== !!S.monoT || st.bypass !== S.bypass) wake();
    if (mode !== S.mode) { S.mode = mode; document.body.classList.toggle("live", mode === "live"); }
    if (!S.dragging && st.device !== S.device) { S.device = st.device; S.sentDevice = st.device; S.pTarget = st.device; }
    S.device = st.device;
    if (!S.mixBusy && !(drag && drag.axis === "y")) { S.mixUser = st.mix / 100; mixIn.value = st.mix; }
    if (!S.outBusy) { S.outT = st.output / 100; volIn.value = st.output; }
    volOut.textContent = Math.round(st.output) + "%";
    S.monoT = st.mono ? 1 : 0; monoB.setAttribute("aria-pressed", st.mono ? "true" : "false");
    S.bypass = !!st.bypass; bypB.setAttribute("aria-pressed", st.bypass ? "true" : "false");
    S.level = Math.max(st.peak[0], st.peak[1]); S.dry = st.dry; S.bands = st.bands && st.bands.length ? st.bands : null;
    const L = st.live;
    if (L.qr === undefined) { L.qr = S.live.qr; L.qrSize = S.live.qrSize; } // sent only when it changes
    if (!L.on) { L.qr = ""; L.qrSize = 0; }
    S.live = L;
    listenEl.hidden = S.mode !== "live";
    document.getElementById("onair").hidden = !L.on;
    document.getElementById("liveErr").hidden = !L.failed;
    retryB.hidden = !L.failed;
    sendLevel.style.width = (L.on ? Math.min(100, Math.round(S.level * 140)) : 0) + "%";
    document.getElementById("liveErr").textContent = ja ? "\u3053\u306ePC\u3067\u53d7\u4fe1\u3092\u958b\u59cb\u3067\u304d\u307e\u305b\u3093\u3067\u3057\u305f\u3002\u30d5\u30a1\u30a4\u30a2\u30a6\u30a9\u30fc\u30eb\u306e\u8a2d\u5b9a\u3092\u78ba\u8a8d\u3057\u3066\u304f\u3060\u3055\u3044\u3002" : "Couldn't start listening on this computer. Check the firewall settings.";
    qrC.hidden = !L.on;
    document.getElementById("liveUrl").textContent = L.url;
    document.getElementById("liveCount").textContent = !L.on ? "" : L.example
      ? (ja ? "\u30d7\u30e9\u30b0\u30a4\u30f3\u3067\u306f\u3001\u540c\u3058Wi-Fi\u306e\u30b9\u30de\u30db\u3067\u3053\u306e\u30b3\u30fc\u30c9\u3092\u8aad\u307f\u53d6\u3063\u3066\u8074\u304d\u307e\u3059" : "In the plugin, phones on the same Wi-Fi scan this code to listen")
      : ja ? (L.listeners ? `${L.listeners}\u53f0\u3067\u518d\u751f\u4e2d` : "\u30b9\u30de\u30db\u3092\u5f85\u3063\u3066\u3044\u307e\u3059") : (L.listeners === 1 ? "1 phone listening" : L.listeners ? `${L.listeners} phones listening` : "Waiting for a phone");
    if (document.activeElement !== pw && pw.value !== L.password) pw.value = L.password;
    pw.placeholder = L.code ? (ja ? `\u81ea\u52d5: ${L.code}` : `auto: ${L.code}`) : "";
    if (L.on && L.qr && L.qr !== qrShown) {
      qrShown = L.qr; drawQr(qx, qrC.width, L.qr, L.qrSize, 0, 0);
      if (L.example) markExample(qx, 0, 0, qrC.width);
      devices.forEach(d => d.lastDraw = -1); wake();
    }
    if (!L.on && qrShown) { qrShown = ""; devices.forEach(d => d.lastDraw = -1); wake(); }
  });
  send({ type: "ready" });

  if (demo) {
    // outside the plugin: a song to play through the sketch of the emulation
    document.getElementById("demo").hidden = false;
    const playB = document.getElementById("play"), icon = document.getElementById("playIcon"), songName = document.getElementById("songName");
    const title = document.querySelector('meta[name="pt-demo-title"]');
    if (title) songName.textContent = title.content;
    if (ja) document.getElementById("pick").textContent = "\u66f2\u3092\u9078\u3076";
    const show = () => { const on = !demo.audio.paused; icon.setAttribute("d", on ? "M3 2h3.5v12H3zM9.5 2H13v12H9.5z" : "M3 1.5v13l11-6.5z");
      playB.setAttribute("aria-pressed", on ? "true" : "false"); playB.setAttribute("aria-label", on ? "Pause" : "Play"); };
    demo.audio.addEventListener("play", show); demo.audio.addEventListener("pause", show);
    demo.audio.addEventListener("error", () => { if (!document.getElementById("file").files.length) songName.textContent = ja ? "\u66f2\u304c\u3042\u308a\u307e\u305b\u3093" : "No song loaded"; });
    playB.addEventListener("click", () => { demo.toggle(); hint(); });
    document.getElementById("file").addEventListener("change", e => {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      demo.choose(f); songName.textContent = f.name.replace(/\.[^.]+$/, "");
    });
  }

  // ---- the plugin's self-test: what was drawn, with a picture ----
  let reported = false;
  function selfTestReport() {
    const w = Math.round(W * DPR), h = Math.round(H * DPR), scale = Math.min(1, 1200 / Math.max(1, w));
    const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(w * scale)); c.height = Math.max(1, Math.round(h * scale));
    const g = c.getContext("2d");
    g.fillStyle = "#0d0c0b"; g.fillRect(0, 0, c.width, c.height);
    for (const layer of [backC, devC, fxC]) g.drawImage(layer, 0, 0, c.width, c.height);
    const qrBox = qrC.getBoundingClientRect(), stageBox = stage.getBoundingClientRect(), k = c.width / Math.max(1, W);
    const qrShownNow = !listenEl.hidden && !qrC.hidden && qrBox.width > 0;
    if (qrShownNow) g.drawImage(qrC, (qrBox.left - stageBox.left) * k, (qrBox.top - stageBox.top) * k, qrBox.width * k, qrBox.height * k);
    const d = g.getImageData(0, 0, c.width, c.height).data, count = d.length / 4;
    let sum = 0, sum2 = 0, lit = 0;
    for (let i = 0; i < d.length; i += 4) { const y = 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]; sum += y; sum2 += y * y; if (y > 40) lit++; }
    const mean = sum / count, sd = Math.sqrt(Math.max(0, sum2 / count - mean * mean));
    const m = document.createElement("canvas"); m.width = m.height = 64; const mg = m.getContext("2d");
    mg.drawImage(devC, devC.width * 0.3, devC.height * 0.25, devC.width * 0.4, devC.height * 0.4, 0, 0, 64, 64);
    const md = mg.getImageData(0, 0, 64, 64).data; let covered = 0;
    for (let i = 3; i < md.length; i += 4) if (md[i] > 0) covered++;
    let renderer = "none";
    try { const gl = rDev.getContext(), ext = gl.getExtension("WEBGL_debug_renderer_info"); renderer = String(gl.getParameter(ext ? ext.UNMASKED_RENDERER_WEBGL : gl.RENDERER)); } catch (e) {}
    send({ type: "diag", kind: "rendered", webgl: renderer, fonts: document.fonts.check('600 20px "Barlow Condensed"'),
           size: [W, H, DPR], meanLuma: +mean.toFixed(1), lumaSpread: +sd.toFixed(1), litShare: +(lit / count).toFixed(3),
           speakerCover: +(covered / 4096).toFixed(3), model: P[Math.max(0, Math.min(P.length - 1, Math.round(S.p)))].name,
           screen: S.mode, onAir: !!S.live.on, qr: { shown: qrShownNow, modules: S.live.qrSize || 0, px: Math.round(qrBox.width) },
           url: S.live.url || "" });
    send({ type: "snapshot", png: c.toDataURL("image/png") });
  }

  // ---- one clock for the picture ----
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let prev = performance.now(), shown = -1, frameNo = 0;
  let lastRendered = 0;
  function tick(now) {
    const realDt = Math.min(0.25, Math.max(0, (now - prev) / 1000)), dt = Math.min(0.05, realDt); prev = now; frameNo++;
    if (!S.dragging) {
      // in small steps, so the camera keeps real time even when frames are slow
      const k = reduce ? 60 : 26, damp = reduce ? 16 : 9.5;
      for (let left = realDt; left > 1e-6; left -= 0.016) {
        const h = Math.min(0.016, left), a = (S.pTarget - S.p) * k - S.pVel * damp;
        S.pVel += a * h; S.p += S.pVel * h;
      }
      if (Math.abs(S.pTarget - S.p) < 0.0005 && Math.abs(S.pVel) < 0.001) { S.p = S.pTarget; S.pVel = 0; }
    } else S.pVel = 0;
    const ease = (v, t, r) => v + (t - v) * Math.min(1, realDt * r);
    S.mix = ease(S.mix, S.bypass ? 0 : S.mixUser, 7);
    S.mono = ease(S.mono, S.monoT, 7);
    S.out = ease(S.out, S.outT, 12);
    if (S.userMove) {
      // the sound follows the camera while the user's move plays out, then settles on the model
      if (!S.dragging && S.p === S.pTarget && S.pVel === 0) { send({ type: "morph", end: true }); S.userMove = false; }
      else send({ type: "morph", pos: Math.max(0, Math.min(P.length - 1, S.p)) });
    }
    // Inside a DAW the room shouldn't cost anything while nothing moves: draw only
    // while something animates, sound is playing, or the state just changed.
    const moving = S.dragging || Math.abs(S.pTarget - S.p) > 1e-4 || Math.abs(S.pVel) > 1e-4
      || Math.abs(S.mix - (S.bypass ? 0 : S.mixUser)) > 1e-3 || Math.abs(S.mono - S.monoT) > 1e-3 || Math.abs(S.out - S.outT) > 1e-3
      || rings.length > 0 || S.level > 0.002 || S.dry > 0.002 || (S.selfTest && !reported);
    if (moving) redraw = Math.max(redraw, 2);
    if (redraw <= 0) { lastRendered = 0; requestAnimationFrame(tick); return; }
    redraw--;
    setCamera(); applyFocus();
    let best = 1e9, focus = 0;
    devices.forEach((d, i) => {
      const off = (xs[i] - cam.x) / cam.dist;
      d.root.visible = Math.abs(off) < 1.8;
      d.root.rotation.y = -0.16 - Math.max(-0.5, Math.min(0.5, off * 0.35));
      if (Math.abs(off) < best) { best = Math.abs(off); focus = i; }
      if (d.screen) {
        const lit = Math.exp(-off * off * 3);
        d.screen.mat.emissiveIntensity = (0.12 + 0.88 * lit) * (0.5 + 0.5 * S.mix);
        if (d.root.visible && (d.lastDraw < 0 || (Math.abs(off) < 0.6 && frameNo % 2 === 0))) { drawScreen(d, P[i], Math.abs(off) < 0.6 ? S.bands : null); d.lastDraw = frameNo; }
      }
    });
    const kick = Math.min(1, S.dry * 2);
    cones.forEach((c, k) => { c.position.z = kick * 0.004 * Math.sin(now * 0.06 + k); });
    rBack.render(back, camera); rDev.render(front, camera);
    if (lastRendered && now - lastRendered < 250) adaptQuality(now - lastRendered);
    lastRendered = now;
    if (!reduce && S.mode !== "live") emit(devices[focus].emit.map(f => toScreen(f())), S.bypass ? 0 : S.level * 0.35, now);
    drawRings(now);
    if (S.selfTest && !reported && frameNo > 30) { reported = true; selfTestReport(); }
    const near = Math.max(0, Math.min(P.length - 1, Math.round(S.p)));
    if (near !== shown) {
      shown = near; const p = P[near];
      nameEl.textContent = p.name; specEl.innerHTML = `${fmtHz(p.hp)} \u2013 ${fmtHz(p.lp)}<br>drive ${p.drive.toFixed(1)} dB`;
      [...chips.children].forEach((b, i) => b.setAttribute("aria-pressed", i === near ? "true" : "false"));
      chips.children[near].scrollIntoView({ block: "nearest", inline: "nearest" });
    }
    const m = Math.round((S.bypass ? 0 : S.mixUser) * 100);
    mixOut.textContent = S.bypass ? "Bypass" : m >= 100 ? "Phone 100%" : m <= 0 ? "Studio 100%" : `Phone ${m}%`;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
