<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhoneTesto</title>
<script src="three.min.js"></script>
<style>
  /* PhoneTesto's editor: the speakers sit on a lamp-lit desk; a thin control strip runs under it.
     The picture is the control surface -- moving the camera between speakers changes the model,
     pulling focus to the studio monitors behind sets the mix. */
  @font-face { font-family: "Barlow"; src: url("fonts/Barlow-Medium.ttf") format("truetype"); font-weight: 400 500; }
  @font-face { font-family: "Barlow"; src: url("fonts/Barlow-SemiBold.ttf") format("truetype"); font-weight: 600; }
  @font-face { font-family: "Barlow"; src: url("fonts/Barlow-Bold.ttf") format("truetype"); font-weight: 700; }
  @font-face { font-family: "Barlow Condensed"; src: url("fonts/BarlowCondensed-SemiBold.ttf") format("truetype"); font-weight: 500 600; }
  @font-face { font-family: "Barlow Condensed"; src: url("fonts/BarlowCondensed-Bold.ttf") format("truetype"); font-weight: 700; }
  :root {
    --room: #0d0c0b;
    --strip: #151311;
    --ink: #eee7dc;
    --dim: #8f877b;
    --lamp: #ffb45e;
    --air: #ff5a3c;
    --line: rgba(238, 231, 220, 0.12);
    --chip: rgba(238, 231, 220, 0.06);
    --sans: "Barlow", "Helvetica Neue", Arial, sans-serif;
    --cond: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--room); color: var(--ink); font-family: var(--sans); overflow: hidden; user-select: none; -webkit-user-select: none; cursor: default; }
  .app { height: 100%; display: grid; grid-template-rows: minmax(0, 1fr) auto; }
  .stage { position: relative; overflow: hidden; touch-action: none; cursor: grab; }
  .stage:active { cursor: grabbing; }
  .stage:focus-visible { outline: 2px solid var(--lamp); outline-offset: -3px; }
  .stage > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 75% 70% at 50% 46%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%); }
  .hud { position: absolute; left: 18px; right: 18px; top: 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; pointer-events: none; }
  .brand { font: 700 12px var(--cond); letter-spacing: 0.24em; color: var(--dim); margin-bottom: 6px; }
  .name { font: 600 clamp(22px, 3.4vw, 34px)/1 var(--cond); letter-spacing: 0.02em; }
  .spec { font: 500 12px/1.4 var(--sans); color: var(--dim); letter-spacing: 0.06em; text-transform: uppercase; font-variant-numeric: tabular-nums; text-align: right; }
  .hint { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font: 500 12px var(--sans);
          color: var(--dim); letter-spacing: 0.04em; pointer-events: none; transition: opacity 0.6s; }
  .hint.gone { opacity: 0; }

  /* Listening on the phone is the first place on the desk: a tablet on a stand, with the code to scan.
     Under it, in the strip, what goes with it: who's listening, the address, the password. */
  .airinfo { display: grid; gap: 5px; flex: 1 1 220px; min-width: 0; }
  .airinfo .count { display: flex; align-items: center; gap: 10px; min-width: 0; font: 600 14px var(--sans); }
  .onair { display: flex; align-items: center; gap: 7px; flex: none; font: 700 12px var(--cond); letter-spacing: 0.2em; color: var(--air); }
  .onair::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--air); box-shadow: 0 0 10px var(--air); }
  .airinfo .send { height: 3px; border-radius: 2px; background: rgba(238, 231, 220, 0.08); overflow: hidden; }
  .airinfo .send i { display: block; height: 100%; width: 0; background: var(--lamp); }
  .airinfo .url { font: 500 12px/1.35 var(--sans); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; user-select: text; -webkit-user-select: text; }
  .pwctl { flex: 0 1 190px; }
  .pwctl input { width: 100%; min-width: 0; font: 600 14px var(--sans); color: var(--ink); background: rgba(238,231,220,0.06); border: 1px solid var(--line);
                 border-radius: 4px; padding: 6px 9px; user-select: text; -webkit-user-select: text; }
  .pwctl input::placeholder { color: var(--dim); opacity: 0.55; font-weight: 500; }
  .err { flex: 1 1 200px; font: 500 13px/1.4 var(--sans); color: var(--air); }
  .retry { appearance: none; border: 1px solid var(--air); border-radius: 999px; padding: 8px 14px; background: transparent; flex: none;
           color: var(--air); font: 600 12px var(--cond); letter-spacing: 0.12em; cursor: pointer; }
  .chip.air-chip { display: flex; align-items: center; gap: 7px; }
  .chip.air-chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--air); box-shadow: 0 0 6px var(--air); }

  .strip { background: var(--strip); border-top: 1px solid var(--line); display: grid; gap: 12px; padding: 12px 18px 14px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; appearance: none; border: 0; border-radius: 999px; padding: 8px 13px; background: var(--chip); color: var(--dim);
          font: 600 13px var(--cond); letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; transition: background 0.3s, color 0.3s; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--room); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
  /* one mode at a time: on the air the emulation's controls aren't shown */
  body.live .emu-only { display: none !important; }
  body:not(.live) .live-only { display: none !important; }
  .ctl { display: grid; gap: 4px; flex: 1 1 150px; min-width: 0; }
  .ctl span { display: flex; justify-content: space-between; font: 600 11px var(--cond); letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
  .ctl output { color: var(--ink); font-variant-numeric: tabular-nums; }
  input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; margin: 0; cursor: pointer; }
  input[type="range"]::-webkit-slider-runnable-track { height: 2px; background: var(--line); }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--ink); margin-top: -8px; }
  .tog { appearance: none; border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; background: transparent; color: var(--dim);
         font: 600 12px var(--cond); letter-spacing: 0.12em; cursor: pointer; flex: none; }
  .tog[aria-pressed="true"] { border-color: var(--lamp); color: var(--lamp); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }

  /* outside the plugin: play a song through the page's sketch of the emulation */
  .demo { display: flex; align-items: center; gap: 12px; flex: 1 1 210px; min-width: 0; }
  .play { appearance: none; border: 0; width: 40px; height: 40px; border-radius: 50%; background: var(--lamp); color: #1b1208; cursor: pointer;
          display: grid; place-items: center; flex: none; }
  .play svg { width: 15px; height: 15px; fill: currentColor; }
  .song { display: grid; gap: 2px; min-width: 0; }
  .song b { font: 600 13px var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song label { font: 500 12px var(--sans); color: var(--dim); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; width: max-content; }
  .song input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .song input:focus-visible + label { outline: 2px solid var(--lamp); outline-offset: 2px; }
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage" tabindex="0" role="group" aria-label="Speaker room. Drag sideways or press the left and right arrows to change speakers; drag up or down or press the up and down arrows to pull focus between the speaker and the studio monitors.">
    <canvas id="back"></canvas>
    <canvas id="dev"></canvas>
    <canvas id="fx"></canvas>
    <div class="vignette"></div>
    <div class="hud"><div><div class="brand">PHONETESTO</div><div class="name" id="name" aria-live="polite">Phone 15/16 Pro</div></div><div class="spec" id="spec"></div></div>
    <div class="hint" id="hint">Drag sideways to change speakers &#xb7; Drag up or down to pull focus</div>
  </div>
  <div class="strip">
    <div class="chips" id="chips" role="group" aria-label="Listen on your phone, or a speaker model"></div>
    <div class="row">
      <div class="airinfo live-only" id="airinfo" role="region" aria-label="Listening on phones">
        <div class="count"><span class="onair" id="onair">LIVE</span><span id="liveCount" aria-live="polite"></span></div>
        <div class="send" aria-hidden="true"><i id="sendLevel"></i></div>
        <div class="url" id="liveUrl"></div>
      </div>
      <label class="ctl pwctl live-only" for="pw"><span id="pwLabel">Password (optional)</span><input id="pw" type="text" maxlength="32" autocomplete="off" spellcheck="false"></label>
      <div class="err live-only" id="liveErr" hidden></div>
      <button class="retry live-only" id="retry" type="button" hidden>Try again</button>
      <div class="demo emu-only" id="demo" hidden>
        <button class="play" id="play" type="button" aria-label="Play" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path id="playIcon" d="M3 1.5v13l11-6.5z"/></svg></button>
        <div class="song"><b id="songName">song.mp3</b><input id="file" type="file" accept="audio/*"><label for="file" id="pick">Choose a song</label></div>
      </div>
      <label class="ctl emu-only" for="mix"><span>Focus <output id="mixOut">Phone 100%</output></span><input id="mix" type="range" min="0" max="100" step="0.5" value="100"></label>
      <label class="ctl" for="vol"><span>Output <output id="volOut">100%</output></span><input id="vol" type="range" min="0" max="100" step="0.5" value="100"></label>
      <button class="tog emu-only" id="mono" type="button" aria-pressed="false">MONO</button>
      <button class="tog emu-only" id="bypass" type="button" aria-pressed="false">BYPASS</button>
    </div>
  </div>
</div>

<script>
(() => {
  // English first: the Japanese texts are kept here, off, until they're redone for the new design
  const JAPANESE = false;
  const ja = JAPANESE && /^ja/i.test(navigator.language || "");
  if (ja) document.documentElement.lang = "ja";
  if (ja) {
    const t = (id, text) => { document.getElementById(id).textContent = text; };
    t("pwLabel", "\u30d1\u30b9\u30ef\u30fc\u30c9\uff08\u4efb\u610f\uff09");
    t("retry", "\u3082\u3046\u4e00\u5ea6");
  }
  // what the stand with the code says
  const AIRTXT = ja ? {
    title: "\u30b9\u30de\u30db\u3067\u8074\u304f",
    how: "\u30b9\u30de\u30db\u306e\u30ab\u30e1\u30e9\u3067\u8aad\u307f\u53d6\u3063\u3066\u304f\u3060\u3055\u3044\u3002\u3053\u306ePC\u3068\u540c\u3058Wi-Fi\u306b\u3064\u306a\u3044\u3067\u304a\u304d\u307e\u3059\u3002",
    note: "\u30b9\u30de\u30db\u306b\u306f\u30df\u30c3\u30af\u30b9\u304c\u305d\u306e\u307e\u307e\u5c4a\u304d\u307e\u3059\u3002\u30aa\u30f3\u30a8\u30a2\u4e2d\u306f\u30a8\u30df\u30e5\u30ec\u30fc\u30c8\u3057\u307e\u305b\u3093\u3002",
    err: "\u3053\u306ePC\u3067\u53d7\u4fe1\u3092\u958b\u59cb\u3067\u304d\u307e\u305b\u3093\u3067\u3057\u305f\u3002\u30d5\u30a1\u30a4\u30a2\u30a6\u30a9\u30fc\u30eb\u306e\u8a2d\u5b9a\u3092\u78ba\u8a8d\u3057\u3066\u304f\u3060\u3055\u3044\u3002",
    off: "\u3053\u3053\u3067\u6b62\u307e\u308b\u3068\u3001\u30b9\u30de\u30db\u306b\u5c4a\u304d\u307e\u3059"
  } : {
    title: "Listen on your phone",
    how: "Scan the code with your phone's camera. The phone needs the same Wi-Fi as this computer.",
    note: "Phones get the mix as it is: no speaker emulation while on air.",
    err: "Couldn't start listening on this computer. Check the firewall settings.",
    off: "Stop here to send the mix to your phone"
  };
  if (ja) document.getElementById("hint").textContent = "\u6a2a\u306b\u30c9\u30e9\u30c3\u30b0\u3067\u6a5f\u7a2e\u3092\u5207\u308a\u66ff\u3048\u30fb\u4e0a\u4e0b\u306b\u30c9\u30e9\u30c3\u30b0\u3067\u30d4\u30f3\u30c8";

  // ---- the plugin: parameters and meters come in as "state", controls go out as "ui" ----
  const backend = window.__JUCE__ && window.__JUCE__.backend;
  const listeners = [];
  const demo = backend ? null : (() => {
    // Opened outside the plugin (in a browser), the page runs against this stand-in: it
    // plays a song through a Web Audio sketch of the emulation (a song.mp3 beside the
    // page, or one the viewer chooses), so the room can be tried by ear.
    const st = { mode: "emulate", device: 3, mix: 100, output: 100, mono: false, bypass: false, peak: [0, 0], dry: 0, bands: [],
                 live: { on: false, failed: false, example: false, url: "", listeners: 0, password: "", code: "", qr: "", qrSize: 0 } };
    const keys = { device: "device", mix: "mix", output: "output", monoSum: "mono", bypass: "bypass" };
    const audio = new Audio(); audio.loop = true; audio.preload = "auto"; audio.src = "song.mp3";
    const bands = new Array(30).fill(0);
    let ctx = null, A = null, morphPos = null;

    function shaperCurve(db) { const g = Math.pow(10, db / 20), c = new Float32Array(2048);
      for (let i = 0; i < c.length; i++) { const x = i / 2047 * 2 - 1; c[i] = Math.tanh(g * x) / g; } return c; }
    function build() {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      const src = ctx.createMediaElementSource(audio), n = { chains: [] };
      n.stereo = ctx.createGain(); n.monoSum = ctx.createGain();
      n.monoSum.channelCount = 1; n.monoSum.channelCountMode = "explicit"; n.monoSum.channelInterpretation = "speakers";
      n.monoTap = ctx.createGain(); n.pre = ctx.createGain();
      src.connect(n.stereo); src.connect(n.monoSum); n.monoSum.connect(n.monoTap); n.stereo.connect(n.pre); n.monoTap.connect(n.pre);
      n.wet = ctx.createGain(); n.dry = ctx.createGain(); n.out = ctx.createGain(); n.engaged = ctx.createGain(); n.bypassed = ctx.createGain();
      for (let k = 0; k < 2; k++) {
        const c = { model: -1 };
        c.hp1 = ctx.createBiquadFilter(); c.hp1.type = "highpass"; c.hp1.Q.value = 0.7071;
        c.hp2 = ctx.createBiquadFilter(); c.hp2.type = "highpass"; c.hp2.Q.value = 0.7071;
        c.pk = ctx.createBiquadFilter(); c.pk.type = "peaking";
        c.lp = ctx.createBiquadFilter(); c.lp.type = "lowpass"; c.lp.Q.value = 0.7071;
        c.sh = ctx.createWaveShaper(); c.sh.oversample = "2x"; c.mk = ctx.createGain(); c.gain = ctx.createGain(); c.gain.gain.value = 0;
        n.pre.connect(c.hp1); c.hp1.connect(c.hp2); c.hp2.connect(c.pk); c.pk.connect(c.lp); c.lp.connect(c.sh); c.sh.connect(c.mk); c.mk.connect(c.gain); c.gain.connect(n.wet);
        n.chains.push(c);
      }
      // as in the plugin: emulation, mixed with the dry signal, output level; BYPASS passes the dry signal untouched
      n.wet.connect(n.out); src.connect(n.dry); n.dry.connect(n.out); n.out.connect(n.engaged); n.engaged.connect(ctx.destination);
      src.connect(n.bypassed); n.bypassed.connect(ctx.destination); n.bypassed.gain.value = 0;
      n.anOut = ctx.createAnalyser(); n.anOut.fftSize = 2048; n.anOut.smoothingTimeConstant = 0; n.engaged.connect(n.anOut); n.bypassed.connect(n.anOut);
      n.anIn = ctx.createAnalyser(); n.anIn.fftSize = 2048; src.connect(n.anIn);
      n.td = new Float32Array(2048); n.fd = new Float32Array(1024);
      A = n;
    }
    function program(c, i) {
      if (c.model === i) return;
      const p = P[i], t = ctx.currentTime;
      c.hp1.frequency.setValueAtTime(p.hp, t); c.hp2.frequency.setValueAtTime(p.hp, t);
      c.pk.frequency.setValueAtTime(p.pk, t); c.pk.Q.setValueAtTime(p.q, t); c.pk.gain.setValueAtTime(p.g, t);
      c.lp.frequency.setValueAtTime(Math.min(p.lp, ctx.sampleRate * 0.45), t);
      c.sh.curve = shaperCurve(p.drive); c.mk.gain.setValueAtTime(Math.pow(10, p.mk / 20), t);
      c.model = i;
    }
    const peakOf = an => { an.getFloatTimeDomainData(A.td); let m = 0; for (let i = 0; i < an.fftSize; i++) m = Math.max(m, Math.abs(A.td[i])); return m; };
    function frame() {
      const playing = !!A && !audio.paused;
      if (A) {
        // the speakers either side of the position, blended linearly, as the plugin does
        const t = ctx.currentTime, k = 0.012, top = P.length - 1;
        const pos = Math.max(0, Math.min(top, morphPos !== null ? morphPos : st.device));
        const lo = Math.min(top - 1, Math.floor(pos)), f = pos - lo;
        program(A.chains[lo % 2], lo); program(A.chains[(lo + 1) % 2], lo + 1);
        A.chains[lo % 2].gain.gain.setTargetAtTime(1 - f, t, k); A.chains[(lo + 1) % 2].gain.gain.setTargetAtTime(f, t, k);
        const mono = st.mono ? 1 : 0, mix = st.mix / 100, on = st.bypass ? 0 : 1;
        A.stereo.gain.setTargetAtTime(1 - mono, t, k); A.monoTap.gain.setTargetAtTime(mono, t, k);
        A.wet.gain.setTargetAtTime(mix, t, k); A.dry.gain.setTargetAtTime(1 - mix, t, k);
        A.out.gain.setTargetAtTime(st.output / 100, t, k);
        A.engaged.gain.setTargetAtTime(on, t, k); A.bypassed.gain.setTargetAtTime(1 - on, t, k);
      }
      const out = playing ? peakOf(A.anOut) : 0;
      st.peak = [out, out]; st.dry = playing ? peakOf(A.anIn) : 0;
      if (playing) {
        A.anOut.getFloatFrequencyData(A.fd);
        const lo = Math.log(60), hi = Math.log(18000), binHz = ctx.sampleRate / A.anOut.fftSize;
        for (let b = 0; b < 30; b++) {
          const f0 = Math.exp(lo + (hi - lo) * b / 30), f1 = Math.exp(lo + (hi - lo) * (b + 1) / 30);
          let m = -200;
          for (let i = Math.max(1, Math.floor(f0 / binHz)); i <= Math.min(A.fd.length - 1, Math.ceil(f1 / binHz)); i++) m = Math.max(m, A.fd[i]);
          bands[b] = Math.max(Math.max(0, Math.min(1, (m + 85) / 66)), bands[b] * 0.86); // the plugin's scale, quick rise, gentle fall
        }
      } else bands.fill(0);
      st.bands = bands.slice();
      listeners.forEach(fn => fn(JSON.parse(JSON.stringify(st))));
    }
    setInterval(frame, 1000 / 30);

    // ON AIR needs the plugin on a network: here the card shows what it looks like, marked as an example
    function example() {
      const n = 25, bits = [];
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
        const finder = (x < 7 && y < 7) || (x >= n - 7 && y < 7) || (x < 7 && y >= n - 7);
        const fx = x >= n - 7 ? x - (n - 7) : x, fy = y >= n - 7 ? y - (n - 7) : y;
        bits.push(finder ? ((fx === 0 || fx === 6 || fy === 0 || fy === 6 || (fx > 1 && fx < 5 && fy > 1 && fy < 5)) ? "1" : "0")
                         : (((x * 7 + y * 13 + x * y) % 5) < 2 ? "1" : "0"));
      }
      return { on: true, example: true, url: "", qr: bits.join(""), qrSize: n };
    }
    return {
      audio,
      handle(o) {
        if (o.type === "param") { const key = keys[o.id]; if (key) st[key] = (key === "mono" || key === "bypass") ? !!o.value : o.value; }
        if (o.type === "morph") morphPos = o.end ? null : o.pos;
        if (o.type === "mode") { st.mode = o.live ? "live" : "emulate"; Object.assign(st.live, o.live ? example() : { on: false, example: false, qr: "", qrSize: 0 }); }
        if (o.type === "password") st.live.password = o.value;
      },
      async toggle() {
        if (!ctx) build();
        if (ctx.state === "suspended") await ctx.resume();
        if (audio.paused) { try { await audio.play(); } catch (e) { return false; } } else audio.pause();
        return !audio.paused;
      },
      choose(file) { audio.src = URL.createObjectURL(file); if (ctx) audio.play().catch(() => {}); }
    };
  })();
  const send = o => { try { backend ? backend.emitEvent("ui", o) : demo.handle(o); } catch (e) {} };
  const onState = f => { if (backend) backend.addEventListener("state", f); else listeners.push(f); };
  const setParam = (id, value) => send({ type: "param", id, value });
  const gesture = (id, on) => send({ type: "gesture", id, on });
  // script errors go to the plugin, which logs them in its self-test
  window.addEventListener("error", e => send({ type: "diag", kind: "error", message: String(e.message || e), where: (e.filename || "") + ":" + (e.lineno || 0) }));
  window.addEventListener("unhandledrejection", e => send({ type: "diag", kind: "error", message: String(e.reason) }));

  // ---- the room, in real 3D ----
  // Two layers share one camera: the studio behind (wall, far desk, monitors) and the
  // desk with the devices in front. Each layer is blurred on its own, so the focus pull
  // that sets MIX is a real change of what is sharp.
  const stage = document.getElementById("stage");
  const backC = document.getElementById("back"), devC = document.getElementById("dev"), fxC = document.getElementById("fx");
  const fx = fxC.getContext("2d");
  let W = 1, H = 1, DPR = 1;
  let redraw = 4; const wake = () => { redraw = Math.max(redraw, 3); };
  const T3 = window.THREE;

  function mkRenderer(canvas, alpha) {
    const r = new T3.WebGLRenderer({ canvas, antialias: true, alpha, powerPreference: "high-performance" });

    const moving = S.dragging || Math.abs(S.pTarget - S.p) > 1e-4 || Math.abs(S.pVel) > 1e-4
      || Math.abs(S.mix - mixTo) > 1e-3 || Math.abs(S.mono - S.monoT) > 1e-3 || Math.abs(S.out - S.outT) > 1e-3
      || rings.length > 0 || (!onAir && (S.level > 0.002 || S.dry > 0.002)) || (S.selfTest && !reported);
    if (moving) redraw = Math.max(redraw, 2);
    if (moving && paused) { quality = paused; paused = 0; frameMs.length = 0; resize(); }
    if (redraw <= 0 && quality < 1) { paused = quality; quality = 1; frameMs.length = 0; resize(); redraw = 1; lastRendered = 0; }
    if (redraw <= 0) { lastRendered = 0; requestAnimationFrame(tick); return; }
    redraw--;
    // at the stand the code is drawn at the full resolution, so a phone can read it
    if (S.p === LO && quality < 1) { quality = 1; frameMs.length = 0; resize(); }
    setCamera(); applyFocus();
    drawAir();
    {
      const off = (X(LO) - cam.x) / cam.dist, lit = Math.exp(-off * off * 3);
      air.root.visible = Math.abs(off) < 1.8;
      air.root.rotation.y = -0.04 - Math.max(-0.5, Math.min(0.5, off * 0.35));
      air.screen.mat.emissiveIntensity = 0.15 + 0.85 * lit;
    }
    let best = Math.abs((X(LO) - cam.x) / cam.dist), focus = LO;
    devices.forEach((d, i) => {
      const off = (xs[i] - cam.x) / cam.dist;
      d.root.visible = Math.abs(off) < 1.8;
      d.root.rotation.y = (P[i].kind === "phone" ? -0.38 : -0.16) - Math.max(-0.5, Math.min(0.5, off * 0.35));
      if (Math.abs(off) < best) { best = Math.abs(off); focus = i; }
      if (d.screen) {
        const lit = Math.exp(-off * off * 3);
        d.screen.mat.emissiveIntensity = (0.12 + 0.88 * lit) * (0.5 + 0.5 * S.mix);
        if (d.root.visible && (d.lastDraw < 0 || (Math.abs(off) < 0.6 && frameNo % 2 === 0))) { drawScreen(d, P[i], Math.abs(off) < 0.6 ? S.bands : null); d.lastDraw = frameNo; }
      }
    });
    const kick = Math.min(1, S.dry * 2);
    cones.forEach((c, k) => { c.position.z = kick * 0.004 * Math.sin(now * 0.06 + k); });
    rBack.render(back, camera); rDev.render(front, camera);
    if (lastRendered && now - lastRendered < 250) adaptQuality(now - lastRendered);
    lastRendered = now;
    if (!reduce && !onAir && focus >= 0) emit(devices[focus].emit.map(f => toScreen(f())), S.bypass ? 0 : S.level * 0.35, now);
    drawRings(now);
    if (S.selfTest && !reported && frameNo > 30 && (!loading || frameNo > 600)) { reported = true; selfTestReport(); }
    const near = Math.max(LO, Math.min(HI, Math.round(S.p)));
    const spec = near < 0 ? (S.live.failed ? (ja ? "\u30aa\u30d5\u30a8\u30a2" : "off air") : S.live.example ? "" : countText(S.live)) : "";
    if (near !== shown || (near < 0 && spec !== shownSpec)) {
      shown = near; shownSpec = spec; const p = at(near);
      nameEl.textContent = p.name;
      if (near < 0) specEl.textContent = spec; else specEl.innerHTML = `${fmtHz(p.hp)} \u2013 ${fmtHz(p.lp)}<br>drive ${p.drive.toFixed(1)} dB`;
      [...chips.children].forEach((b, k) => b.setAttribute("aria-pressed", k === near + 1 ? "true" : "false"));
      chips.children[near + 1].scrollIntoView({ block: "nearest", inline: "nearest" });
    }
    const m = Math.round((S.bypass ? 0 : S.mixUser) * 100);
    mixOut.textContent = S.bypass ? "Bypass" : m >= 100 ? "Phone 100%" : m <= 0 ? "Studio 100%" : `Phone ${m}%`;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
