<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhoneTesto</title>
<script src="three.min.js"></script>
<style>
  /* PhoneTesto's editor: the speakers sit on a lamp-lit desk; a thin control strip runs under it.
     The picture is the control surface -- moving the camera between speakers changes the model,
     pulling focus to the studio monitors behind sets the mix. */
  @font-face { font-family: "Barlow"; src: url("fonts/Barlow-Medium.ttf") format("truetype"); font-weight: 400 500; }
  @font-face { font-family: "Barlow"; src: url("fonts/Barlow-SemiBold.ttf") format("truetype"); font-weight: 600; }
  @font-face { font-family: "Barlow"; src: url("fonts/Barlow-Bold.ttf") format("truetype"); font-weight: 700; }
  @font-face { font-family: "Barlow Condensed"; src: url("fonts/BarlowCondensed-SemiBold.ttf") format("truetype"); font-weight: 500 600; }
  @font-face { font-family: "Barlow Condensed"; src: url("fonts/BarlowCondensed-Bold.ttf") format("truetype"); font-weight: 700; }
  :root {
    --room: #0d0c0b;
    --strip: #151311;
    --ink: #eee7dc;
    --dim: #8f877b;
    --lamp: #ffb45e;
    --air: #ff5a3c;
    --line: rgba(238, 231, 220, 0.12);
    --chip: rgba(238, 231, 220, 0.06);
    --sans: "Barlow", "Helvetica Neue", Arial, sans-serif;
    --cond: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--room); color: var(--ink); font-family: var(--sans); overflow: hidden; user-select: none; -webkit-user-select: none; cursor: default; }
  .app { height: 100%; display: grid; grid-template-rows: minmax(0, 1fr) auto; }
  .stage { position: relative; overflow: hidden; touch-action: none; cursor: grab; }
  .stage:active { cursor: grabbing; }
  .stage > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 75% 70% at 50% 46%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%); }
  .hud { position: absolute; left: 18px; right: 18px; top: 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; pointer-events: none; }
  .brand { font: 700 12px var(--cond); letter-spacing: 0.24em; color: var(--dim); margin-bottom: 6px; }
  .name { font: 600 clamp(22px, 3.4vw, 34px)/1 var(--cond); letter-spacing: 0.02em; }
  .spec { font: 500 12px/1.4 var(--sans); color: var(--dim); letter-spacing: 0.06em; text-transform: uppercase; font-variant-numeric: tabular-nums; text-align: right; }
  .hint { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font: 500 12px var(--sans);
          color: var(--dim); letter-spacing: 0.04em; pointer-events: none; transition: opacity 0.6s; }
  .hint.gone { opacity: 0; }

  /* Live: a card with the code to scan; the phone in the scene shows it too */
  .live { position: absolute; right: 18px; top: 64px; width: 214px; padding: 14px; border-radius: 6px; background: rgba(21, 19, 17, 0.88);
          box-shadow: 0 12px 40px rgba(0,0,0,0.5); display: grid; gap: 10px; cursor: default; }
  .live h2 { margin: 0; display: flex; align-items: center; gap: 8px; font: 700 12px var(--cond); letter-spacing: 0.2em; color: var(--air); }
  .live h2::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--air); box-shadow: 0 0 10px var(--air); }
  .live canvas { width: 186px; height: 186px; background: #fff; border-radius: 4px; image-rendering: pixelated; }
  .live .url { font: 500 11px/1.35 var(--sans); color: var(--dim); word-break: break-all; user-select: text; -webkit-user-select: text; }
  .live .count { font: 600 13px var(--sans); }
  .live label { display: grid; gap: 4px; font: 600 11px var(--cond); letter-spacing: 0.12em; color: var(--dim); }
  .live input { font: 600 14px var(--sans); color: var(--ink); background: rgba(238,231,220,0.06); border: 1px solid var(--line); border-radius: 4px; padding: 7px 9px;
                user-select: text; -webkit-user-select: text; }
  .live .err { font: 500 12px/1.4 var(--sans); color: var(--air); }

  .strip { background: var(--strip); border-top: 1px solid var(--line); display: grid; gap: 12px; padding: 12px 18px 14px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; appearance: none; border: 0; border-radius: 999px; padding: 8px 13px; background: var(--chip); color: var(--dim);
          font: 600 13px var(--cond); letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; transition: background 0.3s, color 0.3s; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--room); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
  .air { appearance: none; border: 1px solid var(--line); height: 40px; border-radius: 999px; padding: 0 18px 0 14px; background: transparent; color: var(--ink);
         font: 700 13px var(--cond); letter-spacing: 0.16em; cursor: pointer; display: flex; align-items: center; gap: 9px; flex: none; }
  .air::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #3a2a24; transition: background 0.3s, box-shadow 0.3s; }
  .air[aria-pressed="true"] { border-color: var(--air); color: var(--air); }
  .air[aria-pressed="true"]::before { background: var(--air); box-shadow: 0 0 10px var(--air); }
  .ctl { display: grid; gap: 4px; flex: 1 1 150px; min-width: 0; }
  .ctl span { display: flex; justify-content: space-between; font: 600 11px var(--cond); letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
  .ctl output { color: var(--ink); font-variant-numeric: tabular-nums; }
  input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; margin: 0; cursor: pointer; }
  input[type="range"]::-webkit-slider-runnable-track { height: 2px; background: var(--line); }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--ink); margin-top: -8px; }
  .tog { appearance: none; border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; background: transparent; color: var(--dim);
         font: 600 12px var(--cond); letter-spacing: 0.12em; cursor: pointer; flex: none; }
  .tog[aria-pressed="true"] { border-color: var(--lamp); color: var(--lamp); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage" aria-label="Speaker room. Drag sideways to change speakers, drag up or down to pull focus.">
    <canvas id="back"></canvas>
    <canvas id="dev"></canvas>
    <canvas id="fx"></canvas>
    <div class="vignette"></div>
    <div class="hud"><div><div class="brand">PHONETESTO</div><div class="name" id="name">Phone 15/16 Pro</div></div><div class="spec" id="spec"></div></div>
    <div class="hint" id="hint">Drag sideways to change speakers &#xb7; Drag up or down to pull focus</div>
    <div class="live" id="live" hidden>
      <h2 id="liveTitle">ON AIR</h2>
      <canvas id="qr" width="186" height="186" aria-label="QR code to open the listening page on a phone"></canvas>
      <div class="url" id="liveUrl"></div>
      <div class="count" id="liveCount"></div>
      <label for="pw">PASSWORD <input id="pw" type="text" maxlength="32" autocomplete="off" spellcheck="false"></label>
      <div class="err" id="liveErr" hidden></div>
    </div>
  </div>
  <div class="strip">
    <div class="chips" id="chips" role="group" aria-label="Speaker model"></div>
    <div class="row">
      <button class="air" id="air" type="button" aria-pressed="false">ON AIR</button>
      <label class="ctl" for="mix"><span>Focus <output id="mixOut">Phone 100%</output></span><input id="mix" type="range" min="0" max="100" step="0.5" value="100"></label>
      <label class="ctl" for="vol"><span>Output <output id="volOut">100%</output></span><input id="vol" type="range" min="0" max="100" step="0.5" value="100"></label>
      <button class="tog" id="mono" type="button" aria-pressed="false">MONO</button>
      <button class="tog" id="bypass" type="button" aria-pressed="false">BYPASS</button>
    </div>
  </div>
</div>

<script>
(() => {
  const ja = /^ja/i.test(navigator.language || "");
  if (ja) document.getElementById("hint").textContent = "\u6a2a\u306b\u30c9\u30e9\u30c3\u30b0\u3067\u6a5f\u7a2e\u3092\u5207\u308a\u66ff\u3048\u30fb\u4e0a\u4e0b\u306b\u30c9\u30e9\u30c3\u30b0\u3067\u30d4\u30f3\u30c8";

  // ---- the plugin: parameters and meters come in as "state", controls go out as "ui" ----
  const backend = window.__JUCE__ && window.__JUCE__.backend;
  const listeners = [];
  const mock = (() => {
    // Opened outside the plugin (a browser), the page runs against this stand-in so it can be tried.
    if (backend) return null;
    const st = { device: 3, mix: 100, output: 100, mono: false, bypass: false, peak: [0, 0], dry: 0, bands: [],
                 live: { on: false, failed: false, url: "", listeners: 0, password: "", code: "K7PX2Q", qr: "", qrSize: 0 } };
    const ids = { device: "device", mix: "mix", output: "output", monoSum: "mono", bypass: "bypass" };
    let t = 0;
    setInterval(() => {
      t += 1 / 30;
      const beat = Math.pow(Math.max(0, Math.sin(t * Math.PI * 2 * 2)), 8);
      st.peak = [0.25 + 0.5 * beat, 0.24 + 0.5 * beat]; st.dry = 0.3 + 0.6 * beat;
      st.bands = Array.from({ length: 30 }, (_, k) => Math.max(0, 0.75 - k * 0.018 + 0.2 * Math.sin(t * 3 + k) * beat));
      listeners.forEach(f => f(JSON.parse(JSON.stringify(st))));
    }, 1000 / 30);
    return { handle(o) {
      if (o.type === "param") { const k = ids[o.id]; if (k) st[k] = (k === "mono" || k === "bypass") ? !!o.value : o.value; }
      if (o.type === "onAir") { st.live.on = !!o.on; st.live.url = o.on ? "http://192.168.1.20:51813/?k=K7PX2Q" : "";
        st.live.qrSize = o.on ? 25 : 0; st.live.qr = o.on ? Array.from({ length: 625 }, (_, i) => ((i * 7919) % 13 < 6 ? "1" : "0")).join("") : ""; }
      if (o.type === "password") st.live.password = o.value;
    } };
  })();
  const send = o => { try { backend ? backend.emitEvent("ui", o) : mock.handle(o); } catch (e) {} };
  const onState = f => { if (backend) backend.addEventListener("state", f); else listeners.push(f); };
  const setParam = (id, value) => send({ type: "param", id, value });
  const gesture = (id, on) => send({ type: "gesture", id, on });

  // ---- the room, in real 3D ----
  // Two layers share one camera: the studio behind (wall, far desk, monitors) and the
  // desk with the devices in front. Each layer is blurred on its own, so the focus pull
  // that sets MIX is a real change of what is sharp.
  const stage = document.getElementById("stage");
  const backC = document.getElementById("back"), devC = document.getElementById("dev"), fxC = document.getElementById("fx");
  const fx = fxC.getContext("2d");
  let W = 1, H = 1, DPR = 1;
  const T3 = window.THREE;

  function mkRenderer(canvas, alpha) {
    const r = new T3.WebGLRenderer({ canvas, antialias: true, alpha, powerPreference: "high-performance" });
    r.outputEncoding = T3.sRGBEncoding; r.toneMapping = T3.ACESFilmicToneMapping; r.toneMappingExposure = 0.82;
    r.shadowMap.enabled = true; r.shadowMap.type = T3.PCFSoftShadowMap;
    if (alpha) r.setClearColor(0x000000, 0);
    return r;
  }
  const rBack = mkRenderer(backC, false), rDev = mkRenderer(devC, true);
  const camera = new T3.PerspectiveCamera(26, 1, 0.01, 40);
  const back = new T3.Scene(), front = new T3.Scene();
  back.background = new T3.Color(0x0c0b0a);

  // reflections: a dark studio with one warm softbox overhead and a cool strip to the side
  function envFor(renderer) {
    const s = new T3.Scene();
    s.add(new T3.Mesh(new T3.BoxGeometry(10, 10, 10), new T3.MeshBasicMaterial({ color: 0x0b0a09, side: T3.BackSide })));
    const panel = (w, h, c, x, y, z, ry, rx) => { const m = new T3.Mesh(new T3.PlaneGeometry(w, h), new T3.MeshBasicMaterial({ color: c, side: T3.DoubleSide }));
      m.position.set(x, y, z); m.rotation.set(rx || 0, ry || 0, 0); s.add(m); };
    panel(3.2, 1.6, 0xffd9b0, 0.4, 3.6, 1.5, 0, Math.PI / 2);
    panel(0.5, 4, 0x8fa6c8, -4.8, 1.2, 0, Math.PI / 2);
    panel(4, 0.4, 0xffc89a, 0, 1.4, 4.9, Math.PI);
    panel(2, 0.25, 0x6c7a90, 2.5, 0.6, -4.9, 0);
    const pm = new T3.PMREMGenerator(renderer), tex = pm.fromScene(s, 0.035).texture; pm.dispose(); return tex;
  }
  back.environment = envFor(rBack); front.environment = envFor(rDev);

  // walnut desk
  function walnut() {
    const c = document.createElement("canvas"); c.width = 1024; c.height = 512; const g = c.getContext("2d");
    const base = g.createLinearGradient(0, 0, 0, 512); base.addColorStop(0, "#3a2619"); base.addColorStop(0.5, "#45301f"); base.addColorStop(1, "#33231a");
    g.fillStyle = base; g.fillRect(0, 0, 1024, 512);
    let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    for (let i = 0; i < 260; i++) {
      const y = rnd() * 512, a = 0.04 + rnd() * 0.12, amp = 2 + rnd() * 9, fq = 0.004 + rnd() * 0.01, ph = rnd() * 6;
      g.strokeStyle = rnd() < 0.7 ? `rgba(20,10,4,${a})` : `rgba(120,80,50,${a * 0.6})`; g.lineWidth = 0.6 + rnd() * 2.2;
      g.beginPath(); for (let x = 0; x <= 1024; x += 16) { const yy = y + Math.sin(x * fq + ph) * amp + Math.sin(x * fq * 3.1 + ph) * amp * 0.3; x ? g.lineTo(x, yy) : g.moveTo(x, yy); } g.stroke();
    }
    const t = new T3.CanvasTexture(c); t.encoding = T3.sRGBEncoding; t.wrapS = t.wrapT = T3.RepeatWrapping; t.anisotropy = 8; return t;
  }
  const deskMap = walnut(); deskMap.repeat.set(4, 2);
  const deskMat = new T3.MeshStandardMaterial({ map: deskMap, roughness: 0.55, metalness: 0, envMapIntensity: 0.12 });
  const deskBack = new T3.Mesh(new T3.PlaneGeometry(40, 20), deskMat); deskBack.rotation.x = -Math.PI / 2; deskBack.receiveShadow = true; back.add(deskBack);
  const wall = new T3.Mesh(new T3.PlaneGeometry(40, 10), new T3.MeshStandardMaterial({ color: 0x1a1714, roughness: 0.95 }));
  back.add(wall);
  // the front desk fades out toward the back, where the studio layer takes over
  const fade = (() => { const c = document.createElement("canvas"); c.width = 4; c.height = 256; const g = c.getContext("2d");
    const gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, "#000"); gr.addColorStop(0.45, "#fff"); gr.addColorStop(1, "#fff");
    g.fillStyle = gr; g.fillRect(0, 0, 4, 256); return new T3.CanvasTexture(c); })();
  const deskFrontMat = deskMat.clone(); deskFrontMat.alphaMap = fade; deskFrontMat.transparent = true; deskFrontMat.depthWrite = true;
  const deskFront = new T3.Mesh(new T3.PlaneGeometry(1, 1), deskFrontMat); deskFront.rotation.x = -Math.PI / 2; deskFront.receiveShadow = true; front.add(deskFront);

  // lights: the desk lamp follows the view; a cool rim from behind gives the edges a line of light
  const lamp = new T3.SpotLight(0xffcf98, 3, 0, 0.36, 0.75, 1.2);
  lamp.castShadow = true; lamp.shadow.mapSize.set(2048, 2048); lamp.shadow.bias = -0.0004; lamp.shadow.radius = 3; lamp.shadow.camera.near = 0.05; lamp.shadow.camera.far = 6;
  front.add(lamp); front.add(lamp.target);
  const rim = new T3.DirectionalLight(0x9db4d8, 0.9); front.add(rim); front.add(rim.target);
  front.add(new T3.HemisphereLight(0xffe4c8, 0x1a120c, 0.05));
  const studioKey = new T3.SpotLight(0xdfe6f2, 4, 0, 0.7, 0.9, 1.0); studioKey.castShadow = true; studioKey.shadow.mapSize.set(1024, 1024);
  back.add(studioKey); back.add(studioKey.target);
  back.add(new T3.HemisphereLight(0xffe4c8, 0x140e0a, 0.04));
  const backLamp = new T3.SpotLight(0xffc890, 3, 0, 0.6, 0.9, 1.2); back.add(backLamp); back.add(backLamp.target);

  // ---- geometry helpers ----
  function rrShape(w, h, r) {
    const s = new T3.Shape(), x = -w / 2, y = -h / 2;
    s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r); s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s;
  }
  // a rounded slab w\u00d7h, d thick, centred, with softened edges
  function slab(w, h, d, r, edge) {
    const e = Math.min(edge, d * 0.45);
    const g = new T3.ExtrudeGeometry(rrShape(w - 2 * e, h - 2 * e, Math.max(0.0002, r - e)), { depth: d - 2 * e, bevelEnabled: true, bevelThickness: e, bevelSize: e, bevelSegments: 5, curveSegments: 14 });
    g.translate(0, 0, -(d - 2 * e) / 2); g.computeVertexNormals(); return g;
  }
  // a flat rounded plane with 0..1 UVs across its box
  function plate(w, h, r) {
    const g = new T3.ShapeGeometry(rrShape(w, h, r), 16), pos = g.attributes.position, uv = g.attributes.uv;
    for (let i = 0; i < pos.count; i++) uv.setXY(i, pos.getX(i) / w + 0.5, pos.getY(i) / h + 0.5);
    return g;
  }
  const mat = {
    titanium: c => new T3.MeshStandardMaterial({ color: c, metalness: 0.9, roughness: 0.32, envMapIntensity: 1.1 }),
    alu: c => new T3.MeshStandardMaterial({ color: c, metalness: 0.85, roughness: 0.28, envMapIntensity: 1.0 }),
    plastic: c => new T3.MeshPhysicalMaterial({ color: c, metalness: 0, roughness: 0.42, clearcoat: 0.3, clearcoatRoughness: 0.4 }),
    gloss: c => new T3.MeshPhysicalMaterial({ color: c, metalness: 0, roughness: 0.28, clearcoat: 1, clearcoatRoughness: 0.08 }),
    dark: new T3.MeshStandardMaterial({ color: 0x050506, roughness: 0.6 }),
    hole: new T3.MeshBasicMaterial({ color: 0x020202 })
  };
  const shadowed = o => { o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); return o; };

  // a display: glass with the picture as its glow, so the lamp still reflects off it
  function display(w, h, r, pxW) {
    const c = document.createElement("canvas"); c.width = pxW; c.height = Math.round(pxW * h / w);
    const tex = new T3.CanvasTexture(c); tex.encoding = T3.sRGBEncoding; tex.anisotropy = 8;
    const m = new T3.MeshPhysicalMaterial({ color: 0x030304, roughness: 0.06, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.02, emissive: 0xffffff, emissiveMap: tex, envMapIntensity: 0.7 });
    const mesh = new T3.Mesh(plate(w, h, r), m);
    return { mesh, canvas: c, g: c.getContext("2d"), tex, mat: m };
  }

  // ---- the speakers ----
  const P = [
    { name: "Phone SE",        hp: 700, pk: 3500, q: 1.8, g: 4.5, lp: 9000,  drive: 11.7, mk: 2.25, kind: "phone", w: 0.1384, h: 0.0673, d: 0.0073, r: 0.0095, edge: 0.0022, body: "alu",      frame: 0xd9d7d2, style: "se" },
    { name: "Phone 11",        hp: 500, pk: 3000, q: 1.6, g: 3.5, lp: 11000, drive: 8.1,  mk: 1.71, kind: "phone", w: 0.1509, h: 0.0757, d: 0.0083, r: 0.0118, edge: 0.0012, body: "alu",      frame: 0xb7aec9, style: "notch" },
    { name: "Phone 13/14",     hp: 400, pk: 2800, q: 1.5, g: 2.5, lp: 12000, drive: 5.4,  mk: 1.64, kind: "phone", w: 0.1467, h: 0.0715, d: 0.0078, r: 0.0108, edge: 0.0008, body: "alu",      frame: 0x2c3240, style: "notch" },
    { name: "Phone 15/16 Pro", hp: 300, pk: 2500, q: 1.4, g: 2.0, lp: 13000, drive: 3.6,  mk: 1.45, kind: "phone", w: 0.1476, h: 0.0716, d: 0.0083, r: 0.0118, edge: 0.0010, body: "titanium", frame: 0xb8ad9c, style: "island" },
    { name: "Android Budget",  hp: 850, pk: 3800, q: 2.0, g: 5.5, lp: 8000,  drive: 14.4, mk: 2.69, kind: "phone", w: 0.1645, h: 0.0763, d: 0.0091, r: 0.0085, edge: 0.0030, body: "plastic",  frame: 0x3a3b3d, style: "chin" },
    { name: "Android",         hp: 450, pk: 3300, q: 1.6, g: 3.2, lp: 11500, drive: 6.84, mk: 1.6,  kind: "phone", w: 0.1620, h: 0.0748, d: 0.0082, r: 0.0100, edge: 0.0016, body: "alu",      frame: 0x3d4a42, style: "punch" },
    { name: "Laptop Speakers", hp: 200, pk: 2000, q: 1.2, g: 1.5, lp: 14000, drive: 2.7,  mk: 1.24, kind: "laptop", w: 0.304, frame: 0x7e8187 },
    { name: "Wired Earbuds",   hp: 150, pk: 4500, q: 1.3, g: 3.0, lp: 16500, drive: 1.8,  mk: 0.31, kind: "buds", w: 0.085, frame: 0xf3f3ef }
  ];
  const short = ["SE", "11", "13/14", "15/16 Pro", "Android Lo", "Android", "Laptop", "Earbuds"];
  const fmtHz = v => v >= 1000 ? (v / 1000).toFixed(v % 1000 ? 1 : 0) + " kHz" : v + " Hz";
  const xs = []; P.forEach((p, i) => xs.push(i ? xs[i - 1] + (P[i - 1].w + p.w) / 2 + 0.2 : 0));
  const aimOf = i => P[i].kind === "laptop" ? 0.085 : P[i].kind === "buds" ? 0.004 : 0.038;
