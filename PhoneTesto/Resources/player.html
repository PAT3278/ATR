<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1d21">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PhoneTesto Live</title>
<style>
  @font-face { font-family: "Barlow Condensed"; font-weight: 700; font-display: swap; src: url(/fonts/BarlowCondensed-Bold.ttf) format("truetype"); }
  @font-face { font-family: "Barlow Condensed"; font-weight: 600; font-display: swap; src: url(/fonts/BarlowCondensed-SemiBold.ttf) format("truetype"); }
  @font-face { font-family: "Barlow"; font-weight: 500; font-display: swap; src: url(/fonts/Barlow-Medium.ttf) format("truetype"); }
  @font-face { font-family: "Barlow"; font-weight: 600; font-display: swap; src: url(/fonts/Barlow-SemiBold.ttf) format("truetype"); }

  /* Same palette as the plugin panel (Source/HardwareStyle.h). */
  :root {
    --panel: #1c1d21;
    --surface: #27292f;
    --surface-hi: #2f3239;
    --border: #383b43;
    --divider: #2a2c32;
    --screen: #131418;
    --text: #f1f0ec;
    --text-dim: #9497a0;
    --text-faint: #5d6069;
    --accent: 255, 138, 43;
    --live: 255, 69, 58;
    --led-off: #45484f;
    --cond: "Barlow Condensed", "Arial Narrow", sans-serif;
    --sans: "Barlow", -apple-system, "Hiragino Sans", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--panel); color: var(--text); }
  body { font: 500 15px/1.45 var(--sans); min-height: 100vh; }
  main {
    max-width: 460px; margin: 0 auto;
    padding: max(18px, env(safe-area-inset-top)) 18px max(26px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 16px;
  }

  .label { font: 700 13px var(--cond); letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-dim); }
  .divider { height: 1px; background: var(--divider); }

  header { display: flex; align-items: center; gap: 10px; }
  .logo { font: 700 30px/1 var(--cond); letter-spacing: 0.02em; }
  .badge { font: 700 15px/1 var(--cond); letter-spacing: 0.04em; color: var(--panel); background: rgb(var(--accent)); border-radius: 4px; padding: 4px 7px 3px; }
  .conn {
    margin-left: auto; display: flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 99px;
    background: var(--surface); border: 1px solid var(--border);
  }
  .conn .label { color: var(--text-dim); font-size: 12px; }
  .led { width: 7px; height: 7px; border-radius: 50%; background: var(--led-off); flex: none; }
  .conn.ok .led { background: rgb(var(--accent)); box-shadow: 0 0 0 3px rgba(var(--accent), 0.25); }
  .conn.bad .led { background: rgb(var(--live)); box-shadow: 0 0 0 3px rgba(var(--live), 0.25); }
  .sub { margin-top: -8px; }

  .well { background: var(--screen); border: 1px solid var(--divider); border-radius: 10px; padding: 14px 16px; }
  #meter { display: block; width: 100%; height: 84px; }

  /* flat LED buttons (same construction as the plugin's) */
  .btn {
    --led: var(--accent);
    position: relative; appearance: none; margin: 0; cursor: pointer; width: 100%;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 0 16px; min-height: 46px; border-radius: 8px;
    background: var(--surface); border: 1px solid var(--border); color: rgba(241,240,236,0.78);
    font: 700 16px var(--cond); letter-spacing: 0.08em; text-transform: uppercase;
    box-shadow: 0 1.5px 0 rgba(0,0,0,0.3);
  }
  .btn[aria-pressed]::before { content: ""; position: absolute; left: 14px; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; border-radius: 50%; background: var(--led-off); }
  .btn:active { filter: brightness(0.88); }
  .btn[aria-pressed="true"] { background: color-mix(in srgb, var(--surface) 86%, rgb(var(--led))); border-color: rgba(var(--led), 0.75); color: var(--text); }
  .btn[aria-pressed="true"]::before { background: rgb(var(--led)); box-shadow: 0 0 0 3.5px rgba(var(--led), 0.3); }
  .btn.solid[aria-pressed="true"] { background: rgb(var(--led)); border-color: rgb(var(--led)); color: #fff; }
  .btn.solid[aria-pressed="true"]::before { background: #fff; box-shadow: 0 0 0 3.5px rgba(255,255,255,0.3); }
  #play { min-height: 72px; font-size: 24px; letter-spacing: 0.16em; }
  #play::before { left: 20px; width: 9px; height: 9px; margin-top: -4.5px; }

  .status-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  #status { font: 700 22px var(--cond); letter-spacing: 0.03em; }
  #substatus { font-size: 13px; color: var(--text-dim); min-height: 0; }
  #substatus:empty { display: none; }
  .readouts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--divider); }
  .readouts .label { font-size: 11px; }
  .readouts b { display: block; font: 700 20px var(--cond); }

  .panel { display: flex; flex-direction: column; gap: 10px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .note { margin: 0; font: 500 13px/1.45 var(--sans); color: var(--text-dim); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  #wake { width: 96px; }

  .field {
    width: 100%; appearance: none; -webkit-appearance: none; outline: none;
    font: 700 18px var(--cond); letter-spacing: 0.04em; color: var(--text);
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 11px 12px;
  }
  select.field {
    padding-right: 36px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M0 0h12L6 8z' fill='%23ff8a2b'/></svg>");
    background-repeat: no-repeat; background-position: right 14px center;
  }
  .field:focus { border-color: rgb(var(--accent)); }
  .field option { background: var(--surface); color: var(--text); }
  .auth-row { display: grid; grid-template-columns: 1fr 120px; gap: 10px; }
  .error { color: rgb(var(--live)); font: 600 13px var(--sans); min-height: 1.2em; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <div class="logo">PHONETESTO</div>
    <span class="badge">PT-1</span>
    <div id="conn" class="conn"><span class="led"></span><span id="connText" class="label">…</span></div>
  </header>
  <div class="label sub">Live receiver</div>
  <div class="divider"></div>

  <div class="well"><canvas id="meter" aria-hidden="true"></canvas></div>

  <button id="play" class="btn solid" aria-pressed="false"><span id="playText">Listen</span></button>

  <div class="well">
    <div class="status-row"><span class="label">Status</span><span id="status"></span></div>
    <div id="substatus"></div>
    <div class="readouts">
      <div><span class="label">Format</span><b id="sFormat">–</b></div>
      <div><span class="label">Latency</span><b id="sLatency">–</b></div>
      <div><span class="label">Level</span><b id="sLevel">–</b></div>
      <div><span class="label">Drops</span><b id="sDrops">0</b></div>
    </div>
  </div>

  <section id="authBox" class="panel" hidden>
    <div class="label">Password</div>
    <p class="note" data-i18n="passwordHint"></p>
    <form id="authForm" class="auth-row">
      <input id="password" class="field" type="password" autocomplete="current-password" enterkeyhint="go">
      <button class="btn" type="submit">Unlock</button>
    </form>
    <div id="authError" class="error"></div>
  </section>

  <section class="panel">
    <div class="label">Mode</div>
    <div class="pair">
      <button id="modeLow" class="btn" type="button" aria-pressed="true">Low latency</button>
      <button id="modeBg" class="btn" type="button" aria-pressed="false">Screen-off</button>
    </div>
    <p id="modeNote" class="note"></p>
  </section>

  <section id="qualityRow" class="panel">
    <div class="label">Quality</div>
    <select id="quality" class="field">
      <option value="pcm24">PCM 24-bit</option>
      <option value="pcm16" selected>PCM 16-bit</option>
      <option value="opus-320">Opus 320 kbps</option>
      <option value="opus-256">Opus 256 kbps</option>
      <option value="opus-192">Opus 192 kbps</option>
      <option value="opus-128">Opus 128 kbps</option>
      <option value="opus-96">Opus 96 kbps</option>
    </select>
    <p id="qualityNote" class="note"></p>
  </section>

  <div id="wakeRow" class="row">
    <span class="label">Keep screen on</span>
    <button id="wake" class="btn" type="button" aria-pressed="true"><span id="wakeText">On</span></button>
  </div>

  <div class="divider"></div>
  <p class="note" data-i18n="hintIos"></p>

  <audio id="bg" playsinline preload="none"></audio>
</main>

<script src="/player-worklet.js"></script>
<script>
"use strict";

// ---------------------------------------------------------------------------
// Strings. Panel labels stay in English like printed hardware; messages and
// notes follow the phone's language.
const I18N = {
  en: {
    tapToListen: "Tap LISTEN", connecting: "Connecting…", playing: "Playing",
    reconnecting: "Reconnecting…", offline: "Plugin not reachable",
    full: "Too many listeners right now",
    passwordHint: "Scan the QR code on the plugin again, or enter the password shown there.",
    wrongPassword: "Wrong password", needPassword: "Enter the password first",
    locked: "Too many wrong attempts. Wait a minute and try again.",
    noteLow: "Lowest delay (≈0.1–0.3 s). Keep this page open and the screen on.",
    noteBg: "Keeps playing with the screen locked, using the phone's media player. Adds ≈1–3 s of delay; 16-bit only.",
    opusNote: "PCM is lossless. Opus uses less Wi-Fi — pick it if the sound drops out.",
    opusUnsupported: "This browser can't decode Opus — PCM only.",
    hintIos: "iPhone: if you hear nothing, turn the volume up and check the silent switch.",
    listening: n => `${n} listening`, connected: "Connected",
  },
  ja: {
    tapToListen: "タップして再生", connecting: "接続中…", playing: "再生中",
    reconnecting: "再接続中…", offline: "プラグインに接続できません",
    full: "接続数が上限に達しています",
    passwordHint: "プラグインのQRコードを読み取り直すか、表示されているパスワードを入力してください。",
    wrongPassword: "パスワードが違います", needPassword: "先にパスワードを入力してください",
    locked: "間違いが続いたため一時的にロックされました。1分ほど待ってから試してください。",
    noteLow: "遅延が最小（約0.1〜0.3秒）。このページを開いたまま画面をつけておいてください。",
    noteBg: "スマホのメディアプレーヤーで再生するため、画面ロック中も鳴り続けます。遅延は約1〜3秒、16bitのみ。",
    opusNote: "PCMはロスレス。OpusはWi-Fiの帯域を節約します。音が途切れる場合に選んでください。",
    opusUnsupported: "このブラウザはOpusに非対応のため、PCMのみ使えます。",
    hintIos: "iPhoneで音が出ない場合：音量を上げ、消音スイッチを確認してください。",
    listening: n => `${n}台が受信中`, connected: "接続済み",
  },
};
const T = (navigator.language || "en").toLowerCase().startsWith("ja") ? I18N.ja : I18N.en;
document.documentElement.lang = T === I18N.ja ? "ja" : "en";
document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = T[el.dataset.i18n]; });

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem("pt-" + k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("pt-" + k, v); } catch {} },
};

// Exposed for automated tests; harmless otherwise.
const stats = { state: "idle", format: "", packets: 0, frames: 0, underruns: 0, dropped: 0, glitches: 0, latencyMs: 0, levelDb: -Infinity, reconnects: 0 };
const engine = { output: "", decoder: "", bufferFrames: 0 };
// ScriptProcessor buffer size; grows (for the rest of the visit) on a phone
// whose main thread stalls for longer than the buffer covers.
let scriptProcessorFrames = 4096;
window.__pt = { stats, engine, get player() { return player; } };

let info = null;
// The access code arrives in the QR code's URL (?k=...); remember it for
// this tab so reloads keep working.
let key = (() => {
  const fromUrl = new URLSearchParams(location.search).get("k");
  try {
    if (fromUrl) sessionStorage.setItem("pt-key", fromUrl);
    return fromUrl || sessionStorage.getItem("pt-key") || "";
  } catch { return fromUrl || ""; }
})();
let mode = store.get("mode", "low");
let wantPlaying = false;
let player = null;
let reconnectTimer = null;
let wakeLock = null;
let opusOK = false;

class AuthError extends Error {}
class FullError extends Error {}
class UnsupportedError extends Error {}

// ---------------------------------------------------------------------------
// Low latency: fetch() the framed stream, decode it, and hand the audio to
// an AudioWorklet (/player-worklet.js) that plays it as one continuous,
// click-free stream and owns the jitter buffer.
class StreamPlayer {
  constructor(fmt, br, onEnd) {
    this.fmt = fmt; this.br = br; this.onEnd = onEnd;
    this.stopped = false; this.ts = 0;
    this.seenUnderruns = 0; this.seenDropped = 0;
  }

  async start() {
    const AC = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AC({ latencyHint: "interactive" });
    this.out = this.ctx.createGain();
    if (this.ctx.audioWorklet && window.AudioWorkletNode) {
      // Secure context (HTTPS/localhost): run the engine off the main thread.
      await this.ctx.audioWorklet.addModule("/player-worklet.js");
      this.node = new AudioWorkletNode(this.ctx, "pt-stream", { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2] });
      this.node.port.onmessage = e => this.onWorkletReport(e.data);
      this.node.connect(this.out);
      this.extraLatency = 0;
      engine.output = "worklet";
    } else if (this.ctx.createScriptProcessor) {
      // Plain-HTTP LAN page (what phones get): browsers withhold AudioWorklet
      // there, so run the same core in a ScriptProcessor.
      this.core = new PtStreamCore(this.ctx.sampleRate, scriptProcessorFrames);
      this.useScriptProcessor(scriptProcessorFrames);
      engine.output = "script-processor";
    } else {
      throw new UnsupportedError();
    }
    this.out.connect(this.ctx.destination);
    const split = this.ctx.createChannelSplitter(2);
    this.out.connect(split);
    this.analysers = [0, 1].map(ch => {
      const a = this.ctx.createAnalyser();
      a.fftSize = 1024;
      split.connect(a, ch);
      return a;
    });
    if (this.ctx.state !== "running") await this.ctx.resume();

    this.abort = new AbortController();
    const url = `/stream?fmt=${this.fmt}&br=${this.br || 0}&key=${encodeURIComponent(key)}&t=${Date.now()}`;
    const res = await fetch(url, { signal: this.abort.signal, cache: "no-store" });
    if (res.status === 401) throw new AuthError();
    if (res.status === 429) throw new AuthError("locked");
    if (res.status === 503) throw new FullError();
    if (!res.ok || !res.body) throw new Error("HTTP " + res.status);
    this.pump(res.body.getReader());
  }

  /** (Re)creates the ScriptProcessor with `size`-frame buffers. Its callbacks
      run on the page's main thread, so a stall there longer than the buffer
      covers (first-run JIT, scrolling, a slow phone) is an audible dropout.
      4096 frames rides out stalls of ~120 ms; a phone that still drops out
      gets 8192 (~250 ms) from then on, at ~0.1 s more delay. */
  useScriptProcessor(size) {
    if (this.node) { this.node.onaudioprocess = null; this.node.disconnect(); }
    this.core.setBlockSize(size);
    this.extraLatency = size / this.ctx.sampleRate;
    engine.bufferFrames = size;

    // Callbacks normally come one buffer apart. Over ~2 buffers apart, the
    // output already ran dry: measured, gaps up to 1.9 buffers stay clean
    // and 2.2 or more always click.
    const dropoutMs = 2.1 * 1000 * size / this.ctx.sampleRate;
    const node = this.ctx.createScriptProcessor(size, 0, 2);
    let last = 0;
    node.onaudioprocess = e => {
      const now = performance.now();
      if (last && now - last > dropoutMs) {
        stats.glitches++;
        if (size < 8192) {
          scriptProcessorFrames = size * 2;
          setTimeout(() => { if (!this.stopped && this.node === node) this.useScriptProcessor(size * 2); });
        }
      }
      last = now;
      this.core.render(e.outputBuffer.getChannelData(0), e.outputBuffer.getChannelData(1));
      const r = this.core.report();
      if (r) this.onWorkletReport(r);
    };
    node.connect(this.out);
    this.node = node;
  }

  async pump(reader) {
    let buf = new Uint8Array(0);
    let header = false;
    try {
      for (;;) {
        const { value, done } = await reader.read();
        if (done || this.stopped) break;
        const merged = new Uint8Array(buf.length + value.length);
        merged.set(buf); merged.set(value, buf.length);
        buf = merged;

        let off = 0;
        if (!header) {
          if (buf.length < 16) continue;
          if (String.fromCharCode(buf[0], buf[1], buf[2], buf[3]) !== "PTS1") throw new Error("bad stream");
          this.wireFormat = buf[4];
          this.setupDecoder();
          header = true; off = 16;
        }
        while (buf.length - off >= 4) {
          const len = buf[off] | (buf[off + 1] << 8) | (buf[off + 2] << 16) | (buf[off + 3] << 24);
          if (buf.length - off - 4 < len) break;
          if (len > 0) this.onPacket(buf.slice(off + 4, off + 4 + len));
          off += 4 + len;
        }
        buf = buf.slice(off);
      }
    } catch (e) {
      if (this.stopped || e.name === "AbortError") return;
    }
    if (!this.stopped) this.onEnd();
  }

  setupDecoder() {
    if (this.wireFormat !== 2) return;

    if (!("AudioDecoder" in window)) {
      // No WebCodecs (plain-HTTP page): libopus compiled to WebAssembly.
      engine.decoder = "wasm";
      this.wasm = new (globalThis["opus-decoder"].OpusDecoder)({ channels: 2, preSkip: 0 });
      this.wasmQueue = [];
      this.wasm.ready.then(() => {
        if (this.stopped) return;
        this.wasmReady = true;
        for (const p of this.wasmQueue) this.decodeWasm(p);
        this.wasmQueue = null;
      });
      return;
    }

    engine.decoder = "webcodecs";
    this.decoder = new AudioDecoder({
      output: ad => this.onAudioData(ad),
      error: () => { if (!this.stopped) this.onEnd(); },
    });
    this.decoder.configure({ codec: "opus", sampleRate: 48000, numberOfChannels: 2 });
  }

  decodeWasm(p) {
    const out = this.wasm.decodeFrame(p);
    if (!out.samplesDecoded) return;
    // The decoder reuses its WebAssembly memory: copy before handing on.
    const L = out.channelData[0].slice(0, out.samplesDecoded);
    const R = (out.channelData[1] || out.channelData[0]).slice(0, out.samplesDecoded);
    this.enqueue(L, R);
  }

  onPacket(p) {
    stats.packets++;
    if (this.wasm) {
      if (this.wasmReady) this.decodeWasm(p); else this.wasmQueue.push(p);
      return;
    }
    if (this.wireFormat === 2) {
      this.decoder.decode(new EncodedAudioChunk({ type: "key", timestamp: this.ts, data: p }));
      this.ts += 20000;
      return;
    }
    const bytes = this.wireFormat === 1 ? 3 : 2;
    const frames = Math.floor(p.length / (bytes * 2));
    const L = new Float32Array(frames), R = new Float32Array(frames);
    if (bytes === 2) {
      const dv = new DataView(p.buffer, p.byteOffset, p.byteLength);
      for (let i = 0; i < frames; i++) {
        L[i] = dv.getInt16(i * 4, true) / 32768;
        R[i] = dv.getInt16(i * 4 + 2, true) / 32768;
      }
    } else {
      const s24 = o => { const v = p[o] | (p[o + 1] << 8) | (p[o + 2] << 16); return (v & 0x800000 ? v - 0x1000000 : v) / 8388608; };
      for (let i = 0; i < frames; i++) { L[i] = s24(i * 6); R[i] = s24(i * 6 + 3); }
    }
    this.enqueue(L, R);
  }

  onAudioData(ad) {
    const n = ad.numberOfFrames, ch = ad.numberOfChannels;
    const planes = [];
    try {
      for (let c = 0; c < ch; c++) {
        const a = new Float32Array(n);
        ad.copyTo(a, { planeIndex: c, format: "f32-planar" });
        planes.push(a);
      }
    } catch {
      // Older WebCodecs builds can't convert on copy: read the native layout.
      planes.length = 0;
      const f = ad.format || "";
      const planar = f.endsWith("-planar");
      const isS16 = f.startsWith("s16");
      const plane = i => {
        const size = ad.allocationSize({ planeIndex: i });
        const raw = isS16 ? new Int16Array(size / 2) : new Float32Array(size / 4);
        ad.copyTo(raw, { planeIndex: i });
        return raw;
      };
      const scale = isS16 ? 1 / 32768 : 1;
      if (planar) {
        for (let c = 0; c < ch; c++) planes.push(Float32Array.from(plane(c), v => v * scale));
      } else {
        const all = plane(0);
        for (let c = 0; c < ch; c++) {
          const a = new Float32Array(n);
          for (let i = 0; i < n; i++) a[i] = all[i * ch + c] * scale;
          planes.push(a);
        }
      }
    }
    ad.close();
    this.enqueue(planes[0], planes[1] || planes[0]);
  }

  enqueue(L, R) {
    if (this.stopped) return;
    stats.frames += L.length;
    if (this.core) { this.core.push(L, R); return; }
    if (L === R) R = L.slice(); // mono: each side needs its own buffer to transfer
    this.node.port.postMessage({ l: L, r: R }, [L.buffer, R.buffer]);
  }

  onWorkletReport(m) {
    stats.underruns += m.underruns - this.seenUnderruns;
    stats.dropped += m.dropped - this.seenDropped;
    this.seenUnderruns = m.underruns;
    this.seenDropped = m.dropped;
    stats.latencyMs = Math.round((m.fill + this.extraLatency + (this.ctx.baseLatency || 0) + (this.ctx.outputLatency || 0)) * 1000);
  }

  /** Per-side RMS and peak of the most recent ~20 ms of output. */
  levels() {
    const out = { rms: [0, 0], peak: [0, 0] };
    if (!this.analysers) return out;
    this.analysers.forEach((an, i) => {
      const a = new Float32Array(an.fftSize);
      an.getFloatTimeDomainData(a);
      let sum = 0, pk = 0;
      for (const v of a) { sum += v * v; pk = Math.max(pk, Math.abs(v)); }
      out.rms[i] = Math.sqrt(sum / a.length);
      out.peak[i] = pk;
    });
    return out;
  }

  stop() {
    this.stopped = true;
    try { this.abort && this.abort.abort(); } catch {}
    try { this.decoder && this.decoder.state !== "closed" && this.decoder.close(); } catch {}
    try { this.node && this.node.disconnect(); } catch {}
    try { this.wasm && this.wasm.free(); } catch {}
    try { this.ctx && this.ctx.close(); } catch {}
  }
}

// Screen-off: hand an endless WAV to the phone's own media player, which
// (unlike Web Audio) keeps playing while the screen is locked.
class ElementPlayer {
  constructor(onEnd) { this.onEnd = onEnd; this.el = $("bg"); }
  async start() {
    // A wrong/stale code would otherwise just look like a broken stream to
    // the media element, and it would retry forever.
    const auth = await fetch(`/auth?key=${encodeURIComponent(key)}`, { cache: "no-store" });
    if (auth.status === 401) throw new AuthError();
    if (auth.status === 429) throw new AuthError("locked");
    this.handler = () => { if (!this.stopped) this.onEnd(); };
    this.el.addEventListener("error", this.handler);
    this.el.addEventListener("ended", this.handler);
    this.el.src = `/live.wav?key=${encodeURIComponent(key)}&t=${Date.now()}`;
    await this.el.play();
    stats.latencyMs = 0;
  }
  levels() { return { rms: [0, 0], peak: [0, 0] }; }
  stop() {
    this.stopped = true;
    this.el.removeEventListener("error", this.handler);
    this.el.removeEventListener("ended", this.handler);
    this.el.pause();
    this.el.removeAttribute("src");
    this.el.load();
  }
}

// ---------------------------------------------------------------------------
// Stereo LED-ladder meter, matching the plugin's (Source/LevelMeter.cpp):
// -60..0 dBFS, instant attack / 24 dB/s release on the peak, 1.5 s hold.
const FLOOR = -60;
const meter = { canvas: $("meter"), sides: [{ level: FLOOR, hold: FLOOR, age: 0 }, { level: FLOOR, hold: FLOOR, age: 0 }], last: performance.now(), dirty: true };

function drawMeter() {
  const c = meter.canvas, dpr = window.devicePixelRatio || 1;
  const w = Math.round(c.clientWidth * dpr), h = Math.round(c.clientHeight * dpr);
  if (!w || !h) return;
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  const g = c.getContext("2d"), s = dpr;
  g.clearRect(0, 0, w, h);

  const left = 18 * s, right = w - 46 * s, rowH = 18 * s, rows = [6 * s, 32 * s];
  const xFor = db => left + (Math.min(0, Math.max(FLOOR, db)) - FLOOR) / -FLOOR * (right - left);
  const zone = db => db >= -1 ? [255, 69, 58] : db >= -9 ? [255, 204, 61] : [53, 208, 127];
  const seg = 3 * s, pitch = 4 * s;

  g.font = `700 ${12 * s}px "Barlow Condensed", sans-serif`;
  g.textBaseline = "middle";

  meter.sides.forEach((sd, i) => {
    const y = rows[i];
    g.fillStyle = "#9497a0"; g.textAlign = "left";
    g.fillText(i ? "R" : "L", 0, y + rowH / 2);

    for (let x = left; x + seg <= right + 0.5; x += pitch) {
      const db = FLOOR + (x + seg / 2 - left) / (right - left) * -FLOOR;
      const [r, gg, b] = zone(db);
      g.fillStyle = db <= sd.level ? `rgb(${r},${gg},${b})` : `rgba(${r},${gg},${b},0.09)`;
      g.fillRect(x, y, seg, rowH);
    }
    if (sd.hold > FLOOR + 0.5) {
      const [r, gg, b] = zone(sd.hold);
      g.fillStyle = `rgb(${r},${gg},${b})`;
      g.fillRect(xFor(sd.hold) - 1 * s, y, 2 * s, rowH);
    }

    g.textAlign = "right";
    g.fillStyle = sd.hold >= -1 ? "rgb(255,69,58)" : "#f1f0ec";
    g.font = `700 ${14 * s}px "Barlow Condensed", sans-serif`;
    g.fillText(sd.hold <= FLOOR + 0.5 ? "–" : sd.hold.toFixed(1), w, y + rowH / 2);
    g.font = `700 ${12 * s}px "Barlow Condensed", sans-serif`;
  });

  g.fillStyle = "#5d6069"; g.textAlign = "center";
  g.font = `600 ${11 * s}px "Barlow Condensed", sans-serif`;
  for (const db of [-60, -48, -36, -24, -12, -6, 0]) g.fillText(String(db), xFor(db), h - 8 * s);
}

function updateMeter(peaks, dt) {
  meter.sides.forEach((sd, i) => {
    const db = peaks[i] > 0 ? Math.max(FLOOR, 20 * Math.log10(peaks[i])) : FLOOR;
    const before = sd.level + sd.hold;
    sd.level = db > sd.level ? db : Math.max(db, sd.level - 24 * dt);
    if (db >= sd.hold) { sd.hold = db; sd.age = 0; }
    else if ((sd.age += dt) > 1.5) sd.hold = Math.max(FLOOR, sd.hold - 30 * dt);
    if (Math.abs(sd.level + sd.hold - before) > 0.05) meter.dirty = true;
  });
  if (meter.dirty) { drawMeter(); meter.dirty = false; }
}

// ---------------------------------------------------------------------------
const wakeOn = () => $("wake").getAttribute("aria-pressed") === "true";

function setStatus(text, sub = "") { $("status").textContent = text; $("substatus").textContent = sub; }

function setPlayingUi(on) {
  $("play").setAttribute("aria-pressed", String(on));
  $("playText").textContent = on ? "Listening" : "Listen";
}

function selectedStream() {
  const q = $("quality").value;
  if (mode === "bg") return { fmt: "pcm16", br: 0, label: "WAV 16" };
  if (q.startsWith("opus") && opusOK) { const br = +q.split("-")[1]; return { fmt: "opus", br, label: `OPUS ${br}` }; }
  if (q === "pcm24") return { fmt: "pcm24", br: 0, label: "PCM 24" };
  return { fmt: "pcm16", br: 0, label: "PCM 16" };
}

async function requestWakeLock() {
  if (mode !== "low" || !wakeOn() || document.visibilityState !== "visible") return;
  if ("wakeLock" in navigator) {
    try { wakeLock = await navigator.wakeLock.request("screen"); engine.keepAwake = "wake-lock"; return; } catch {}
  }
  if (!keepAwakeVideo.isConnected) document.body.appendChild(keepAwakeVideo);
  try { await keepAwakeVideo.play(); engine.keepAwake = "video"; } catch {}
}
function releaseWakeLock() {
  try { wakeLock && wakeLock.release(); } catch {}
  wakeLock = null;
  keepAwakeVideo.pause();
  engine.keepAwake = "";
}

async function startPlayback() {
  clearTimeout(reconnectTimer);
  if (info && info.auth && !key) { wantPlaying = false; setPlayingUi(false); showAuth(T.needPassword); return; }

  // Lets Web Audio play even with the iPhone's silent switch on (Safari 17+).
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch {}

  const s = selectedStream();
  stats.format = s.label; stats.state = "connecting";
  $("sFormat").textContent = s.label;
  setStatus(stats.reconnects ? T.reconnecting : T.connecting);
  setPlayingUi(true);

  const onEnd = () => scheduleReconnect();
  player = mode === "bg" ? new ElementPlayer(onEnd) : new StreamPlayer(s.fmt, s.br, onEnd);

  try {
    await player.start();
    if (!wantPlaying) { player.stop(); return; }
    stats.state = "playing";
    setStatus(T.playing);
    requestWakeLock();
    if ("mediaSession" in navigator) {
      try {
        navigator.mediaSession.metadata = new MediaMetadata({ title: "PhoneTesto Live", artist: "DAW" });
        navigator.mediaSession.setActionHandler("pause", () => togglePlay(false));
        navigator.mediaSession.setActionHandler("play", () => togglePlay(true));
      } catch {}
    }
  } catch (e) {
    try { player.stop(); } catch {}
    player = null;
    if (e instanceof AuthError) { wantPlaying = false; setPlayingUi(false); stats.state = "auth"; showAuth(e.message === "locked" ? T.locked : T.wrongPassword); setStatus(T.tapToListen); return; }
    if (e instanceof UnsupportedError) { mode = "bg"; store.set("mode", mode); applyMode(); startPlayback(); return; }
    if (e instanceof FullError) { setStatus(T.full); }
    scheduleReconnect();
  }
}

function scheduleReconnect() {
  if (!wantPlaying) return;
  if (player) { try { player.stop(); } catch {} player = null; }
  stats.state = "reconnecting"; stats.reconnects++;
  setStatus(T.reconnecting);
  clearTimeout(reconnectTimer);
  reconnectTimer = setTimeout(() => { if (wantPlaying) startPlayback(); }, 1500);
}

function stopPlayback() {
  clearTimeout(reconnectTimer);
  if (player) { try { player.stop(); } catch {} player = null; }
  releaseWakeLock();
  stats.state = "idle"; stats.latencyMs = 0;
  setPlayingUi(false);
  setStatus(T.tapToListen);
}

function togglePlay(force) {
  const next = typeof force === "boolean" ? force : !wantPlaying;
  if (next === wantPlaying) return;
  wantPlaying = next;
  stats.reconnects = 0;
  if (wantPlaying) startPlayback(); else stopPlayback();
}

function restartIfPlaying() { if (wantPlaying) { if (player) { try { player.stop(); } catch {} player = null; } startPlayback(); } }

// ---------------------------------------------------------------------------
function showAuth(message) { $("authBox").hidden = false; $("authError").textContent = message || ""; $("password").focus(); }

$("authForm").addEventListener("submit", async ev => {
  ev.preventDefault();
  const candidate = $("password").value;
  $("authError").textContent = "";
  try {
    const r = await fetch(`/auth?key=${encodeURIComponent(candidate)}`, { cache: "no-store" });
    if (r.status === 204) {
      key = candidate;
      try { sessionStorage.setItem("pt-key", key); } catch {}
      $("authBox").hidden = true;
      $("authError").textContent = "";
    } else {
      $("authError").textContent = r.status === 429 ? T.locked : T.wrongPassword;
    }
  } catch { $("authError").textContent = T.offline; }
});

function applyMode() {
  $("modeLow").setAttribute("aria-pressed", String(mode === "low"));
  $("modeBg").setAttribute("aria-pressed", String(mode === "bg"));
  $("modeNote").textContent = mode === "low" ? T.noteLow : T.noteBg;
  $("qualityRow").hidden = mode !== "low";
  $("wakeRow").hidden = mode !== "low";
}
$("modeLow").addEventListener("click", () => { mode = "low"; store.set("mode", mode); applyMode(); restartIfPlaying(); });
$("modeBg").addEventListener("click", () => { mode = "bg"; store.set("mode", mode); applyMode(); releaseWakeLock(); restartIfPlaying(); });
$("quality").addEventListener("change", () => { store.set("quality", $("quality").value); restartIfPlaying(); });
function setWake(on) {
  $("wake").setAttribute("aria-pressed", String(on));
  $("wakeText").textContent = on ? "On" : "Off";
}
$("wake").addEventListener("click", () => {
  const on = !wakeOn();
  setWake(on);
  store.set("wake", on ? "1" : "0");
  if (on) requestWakeLock(); else releaseWakeLock();
});
$("play").addEventListener("click", () => togglePlay());
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && wantPlaying) requestWakeLock(); });

async function pollInfo() {
  try {
    const r = await fetch("/info", { cache: "no-store" });
    info = await r.json();
    $("conn").className = "conn ok";
    $("connText").textContent = info.listeners > 0 ? T.listening(info.listeners) : T.connected;
    if (info.auth && !key && $("authBox").hidden) showAuth();
  } catch {
    $("conn").className = "conn bad";
    $("connText").textContent = T.offline;
  }
}

function frame(now) {
  const dt = Math.min(0.2, Math.max(0.001, (now - meter.last) / 1000));
  meter.last = now;

  const playing = player && stats.state === "playing";
  const lv = playing ? player.levels() : { rms: [0, 0], peak: [0, 0] };
  const rms = Math.max(lv.rms[0], lv.rms[1]);
  const db = rms > 0 ? 20 * Math.log10(rms) : -Infinity;
  if (playing) stats.levelDb = db;
  updateMeter(lv.peak, dt);

  $("sLevel").textContent = playing && Number.isFinite(db) ? `${Math.round(db)}` : "–";
  $("sLatency").textContent = stats.state !== "playing" ? "–" : mode === "bg" ? "1–3 s" : `${stats.latencyMs} ms`;
  $("sDrops").textContent = String(stats.underruns + stats.dropped + stats.glitches);
  requestAnimationFrame(frame);
}

(async function init() {
  $("quality").value = store.get("quality", "pcm16");
  setWake(store.get("wake", "1") === "1");
  setStatus(T.tapToListen);

  try {
    opusOK = "AudioDecoder" in window && "EncodedAudioChunk" in window &&
      !!(await AudioDecoder.isConfigSupported({ codec: "opus", sampleRate: 48000, numberOfChannels: 2 })).supported;
  } catch { opusOK = false; }
  if (!opusOK && !("AudioDecoder" in window)) {
    // No WebCodecs (plain-HTTP page): load the WebAssembly Opus decoder.
    opusOK = await new Promise(resolve => {
      const tag = document.createElement("script");
      tag.src = "/opus-decoder.js";
      tag.onload = () => resolve(!!globalThis["opus-decoder"] && typeof WebAssembly === "object");
      tag.onerror = () => resolve(false);
      document.head.appendChild(tag);
    });
  }
  document.querySelectorAll('#quality option[value^="opus"]').forEach(o => { o.disabled = !opusOK; });
  if (!opusOK && $("quality").value.startsWith("opus")) $("quality").value = "pcm16";
  $("qualityNote").textContent = opusOK ? T.opusNote : T.opusUnsupported;

  applyMode();
  if (document.fonts) document.fonts.ready.then(() => { meter.dirty = true; });
  window.addEventListener("resize", () => { meter.dirty = true; });
  await pollInfo();
  setInterval(pollInfo, 3000);
  requestAnimationFrame(frame);
})();
</script>
