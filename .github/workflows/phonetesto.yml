name: PhoneTesto

# Builds the plugin on Windows, macOS and Linux, runs the test suite and
# plugin validators on each, and attaches the built plugins to the run as
# downloadable artifacts. Standard GitHub-hosted runners are free on public
# repositories.

on:
  push:
    paths: ["PhoneTesto/**", ".github/workflows/phonetesto.yml"]
  pull_request:
    paths: ["PhoneTesto/**", ".github/workflows/phonetesto.yml"]
  workflow_dispatch:

concurrency:
  group: phonetesto-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PLUGINVAL_VERSION: v1.0.4
  PLAYWRIGHT_VERSION: 1.63.0

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bin: build/Release            # Visual Studio generator: per-config folder
            exe: .exe
            pluginval: pluginval_Windows.zip
            pluginvalExe: ./pluginval.exe
          - name: macOS
            os: macos-latest
            bin: build
            exe: ""
            pluginval: pluginval_macOS.zip
            pluginvalExe: ./pluginval.app/Contents/MacOS/pluginval
          - name: Linux
            os: ubuntu-latest
            bin: build
            exe: ""
            pluginval: pluginval_Linux.zip
            pluginvalExe: xvfb-run -a ./pluginval
    defaults:
      run:
        shell: bash
        working-directory: PhoneTesto
    env:
      ARTEFACTS: build/PhoneTesto_artefacts/Release

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev libcurl4-openssl-dev xvfb zbar-tools

      - name: Configure
        run: |
          cmake --version
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: DSP tests
        run: ${{ matrix.bin }}/PhoneTestoDspTest${{ matrix.exe }}

      - name: Live Monitor server tests
        run: ${{ matrix.bin }}/PhoneTestoLiveServerTest${{ matrix.exe }}

      - name: pluginval, VST3 (strictness 10)
        run: |
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/${{ matrix.pluginval }}"
          cmake -E tar xf pluginval.zip
          ${{ matrix.pluginvalExe }} --strictness-level 10 --skip-gui-tests --validate-in-process \
            --validate "$ARTEFACTS/VST3/PhoneTesto.vst3"

      - name: Audio Unit validation (auval + pluginval)
        if: runner.os == 'macOS'
        run: |
          # The build installs the AU into ~/Library/Audio/Plug-Ins/Components;
          # restart the registrar so auval sees it.
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Pht1 Atra
          ${{ matrix.pluginvalExe }} --strictness-level 10 --skip-gui-tests --validate-in-process \
            --validate ~/Library/Audio/Plug-Ins/Components/PhoneTesto.component

      - name: Editor snapshots
        run: |
          if [ "$RUNNER_OS" = Linux ]; then run="xvfb-run -a"; else run=""; fi
          $run ${{ matrix.bin }}/PhoneTestoEditorSnapshot${{ matrix.exe }} build/shots 1.5

      - name: QR code in the Live snapshot decodes to the phone URL
        if: runner.os == 'Linux'
        run: |
          url=$(zbarimg -q --raw build/shots/editor-live.png)
          echo "$url"
          [[ "$url" == http://*/?k=* ]]

      - name: Phone player page tests (Chromium)
        if: runner.os == 'Linux'
        run: |
          npm install --no-save --no-package-lock "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium
          node Tests/browser/player_test.mjs build/PhoneTestoLiveDemo build/shots

      - name: Package plugins
        run: |
          mkdir -p dist
          case "$RUNNER_OS" in
            Windows)
              cp -r "$ARTEFACTS/VST3/PhoneTesto.vst3" dist/
              cp "$ARTEFACTS/Standalone/PhoneTesto.exe" dist/
              ;;
            macOS)
              # ditto keeps the bundles' executable bits, which artifact zips drop.
              ditto -c -k --keepParent "$ARTEFACTS/VST3/PhoneTesto.vst3" dist/PhoneTesto-VST3.zip
              ditto -c -k --keepParent "$ARTEFACTS/AU/PhoneTesto.component" dist/PhoneTesto-AU.zip
              ditto -c -k --keepParent "$ARTEFACTS/Standalone/PhoneTesto.app" dist/PhoneTesto-Standalone.zip
              ;;
            Linux)
              tar -C "$ARTEFACTS/VST3" -czf dist/PhoneTesto-VST3.tar.gz PhoneTesto.vst3
              tar -C "$ARTEFACTS/Standalone" -czf dist/PhoneTesto-Standalone.tar.gz PhoneTesto
              ;;
          esac

      - name: Upload plugins
        uses: actions/upload-artifact@v6
        with:
          name: PhoneTesto-${{ matrix.name }}
          path: PhoneTesto/dist
          retention-days: 30

      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: snapshots-${{ matrix.name }}
          path: PhoneTesto/build/shots
          if-no-files-found: ignore
          retention-days: 30
