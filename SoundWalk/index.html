<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<title>SOUND WALK</title>
<meta name="description" content="歩いて、近づいて、聴いて、買う。曲ごとの景色がある3Dマップ。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Saira+Condensed:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="cv" tabindex="0" aria-label="曲の風景をめぐる3Dマップ"></canvas>

  <div id="hud">
    <div class="hud-l">
      <div class="loc"><span class="lbl">LOCATION</span><span id="locName">はじまりの広場</span></div>
      <div id="np" hidden>
        <span id="npArrow" class="np-arrow" aria-hidden="true">▲</span>
        <span id="npTitle">？？？</span>
        <span id="npMeter" class="meter" aria-hidden="true"></span>
      </div>
    </div>
    <div class="hud-r">
      <button id="mapBtn" class="hbtn" type="button">MAP <span id="foundCount" class="count">0/0</span></button>
      <button id="soundBtn" class="hbtn" type="button" aria-pressed="false">SOUND</button>
    </div>
  </div>
  <div id="banner"><span class="en" id="bannerEn"></span><span class="jp" id="bannerJp"></span></div>
  <div id="prompt" hidden><kbd id="promptKey">Z</kbd><span id="promptText"></span></div>
  <div id="hint"><span><b>WASD / ←↑→↓</b>移動</span><span><b>Shift</b>走る</span><span><b>ドラッグ・Q/E</b>視点</span><span><b>Z / Enter</b>眺める・調べる</span><span><b>クリック</b>そこへ移動</span><span><b>M</b>地図</span></div>
  <div id="stick" aria-hidden="true"><div id="knob"></div></div>
  <button id="btnA" type="button">A<small>眺める</small></button>

  <div id="dialog" hidden><p id="dlgText"></p><span class="next">▼</span></div>

  <!-- Scenic view: letterbox, song card, purchase -->
  <div id="bars" aria-hidden="true"><i></i><i></i></div>
  <div id="view" hidden>
    <button id="backBtn" class="hbtn back" type="button">← もどる <small>Esc</small></button>
    <article class="card">
      <p class="c-place"><span id="vPlace"></span><span class="en" id="vPlaceEn"></span></p>
      <h2 id="vTitle"></h2>
      <p class="c-meta" id="vMeta"></p>
      <p class="c-cap" id="vCaption"></p>
      <div class="c-vol"><span>VOL</span><span id="vVol" class="meter big"></span></div>
      <div id="vActions" class="acts"></div>
      <p id="vSketch" class="c-note" hidden>※ 仮音源（ジェネレーティブ）で再生中</p>
    </article>
  </div>

  <div id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle" hidden>
    <div class="m-head"><div class="m-title"><span class="m-tag">MAP</span><h2 id="mTitle">地図</h2></div><button class="xbtn" type="button" id="mapClose">CLOSE ✕</button></div>
    <div class="m-body">
      <canvas id="mapCanvas" width="640" height="640"></canvas>
      <ul id="mapList" class="map-list"></ul>
    </div>
  </div>

  <div id="toast" hidden></div>
  <div id="fade"></div>

  <section id="title" hidden>
    <div class="t-inner">
      <p class="t-kick" id="tArtist">NS HACK</p>
      <h1 id="tTitle">SOUND WALK</h1>
      <p class="t-sub">曲ごとの景色を歩いて、近づいて、聴いて、買う。<br>近づくほど音が大きくなり、景色を眺めていると、もっと大きくなる。</p>
      <button id="startBtn" class="btn primary" type="button">はじめる ▶</button>
      <p class="t-note">音が出ます。ヘッドホン推奨。</p>
    </div>
  </section>
  <div id="loading"><span>NOW LOADING</span><span class="disc"></span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="src/songs.js"></script>
<script src="src/synth.js"></script>
<script src="src/audio.js"></script>
<script src="src/places.js"></script>
<script src="src/places2.js"></script>
<script src="src/game.js"></script>
</body>
</html>
