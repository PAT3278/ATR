<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0a">
<title>SOUND WALK</title>
<meta name="description" content="歩いて、近づいて、聴いて、買う。曲ごとの景色がある3Dマップ。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Hind:wght@600;700&family=Noto+Serif+JP:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body class="pre">
<div id="app">
  <canvas id="cv" tabindex="0" aria-label="曲の風景をめぐる3Dマップ"></canvas>

  <div id="hud">
    <div class="hud-l">
      <span id="locName" hidden></span>
      <div id="discs" aria-label="見つけた曲"></div>
      <div id="np" hidden>
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11"/></svg>
        <span id="npMeter" class="meter" aria-hidden="true"></span>
        <span id="npArrow" class="np-arrow" aria-hidden="true">▲</span>
        <span id="npTitle"></span>
      </div>
    </div>
    <div class="hud-r">
      <button id="soundBtn" class="ibtn" type="button" aria-pressed="false" aria-label="音のオン・オフ"><svg class="ic on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11"/></svg><svg class="ic off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg></button>
      <button id="mapBtn" class="minimap" type="button" aria-label="地図をひらく"><canvas id="mini" width="132" height="132"></canvas><kbd>M</kbd></button>
    </div>
  </div>
  <div id="edge" aria-hidden="true"></div>
  <div id="banner"><span class="en" id="bannerEn"></span><span class="jp" id="bannerJp"></span></div>
  <div id="prompt" hidden><kbd id="promptKey">Z</kbd><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span id="promptText"></span></div>
  <div id="hint" aria-hidden="true"><span class="how pc"><span class="wasd"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span><span class="h1"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="5"/><path d="M12 7v3"/></svg><em>⟲</em></span><span class="h1"><kbd>Shift</kbd><em>»</em></span><span class="h1"><kbd>Space</kbd><em>⤒</em></span><span class="h1"><kbd>Z</kbd><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></span><span class="h1"><kbd>M</kbd><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2V6zM9 4v14M15 6v14"/></svg></span></span></div>
  <div id="stick" aria-hidden="true"><div id="knob"></div></div>
  <button id="btnA" type="button" aria-label="眺める"><small>A</small><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>

  <button id="btnB" type="button" aria-label="ダッシュ">»</button>

  <div id="dialog" hidden><p id="dlgText"></p><span class="next">▼</span></div>

  <div id="bars" aria-hidden="true"><i></i><i></i></div>
  <div id="view" hidden>
    <button id="backBtn" class="ibtn back" type="button" aria-label="もどる"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5M11 5l-7 7 7 7"/></svg><kbd>Esc</kbd></button>
    <article class="card">
      <span id="vPlace" hidden></span>
      <h2 id="vTitle"></h2>
      <p class="c-meta" id="vMeta"></p>
      <div class="c-vol"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11"/></svg><span id="vVol" class="meter big"></span></div>
      <div id="vActions" class="acts"></div>
      <p id="vSketch" class="c-note" hidden>DEMO SOUND</p>
    </article>
  </div>

  <div id="modal" role="dialog" aria-modal="true" aria-label="地図" hidden>
    <button class="ibtn" type="button" id="mapClose" aria-label="とじる">✕</button>
    <canvas id="mapCanvas" width="720" height="720"></canvas>
  </div>

  <div id="toast" hidden></div>
  <div id="fade"></div>

  <section id="title" hidden>
    <div class="t-inner">
      <p class="t-kick" id="tArtist">NS HACK</p>
      <h1 id="tTitle">SOUND WALK</h1>
      <button id="startBtn" class="start" type="button">▶ START</button>
      <div class="t-how" aria-hidden="true"><span class="how pc"><span class="wasd"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span><span class="h1"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="5"/><path d="M12 7v3"/></svg><em>⟲</em></span><span class="h1"><kbd>Shift</kbd><em>»</em></span><span class="h1"><kbd>Space</kbd><em>⤒</em></span><span class="h1"><kbd>Z</kbd><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></span><span class="h1"><kbd>M</kbd><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2V6zM9 4v14M15 6v14"/></svg></span></span><span class="how touch"><span class="h1"><span class="ministick"><i></i></span></span><span class="h1"><span class="minia">A</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></span><span class="h1"><span class="minia">»</span></span></span><span class="h1 hp"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15v-3a8 8 0 0116 0v3"/><rect x="3" y="14" width="4" height="6" rx="1"/><rect x="17" y="14" width="4" height="6" rx="1"/></svg></span></div>
    </div>
  </section>
  <div id="loading"><span>NOW LOADING</span><span class="disc"></span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="src/songs.js"></script>
<script src="src/synth.js"></script>
<script src="src/audio.js"></script>
<script src="src/places.js"></script>
<script src="src/places2.js"></script>
<script src="src/game.js"></script>
</body>
</html>
